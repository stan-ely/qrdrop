# Unit tests and the type checker, on every push and pull request.
#
# The e2e suites are deliberately NOT here. transfer.e2e.mjs needs live public
# Nostr relays, so it fails for reasons that have nothing to do with this
# repository and would train everyone to ignore a red tick. It is run by hand.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the point of a CI
      # run. node-datachannel is an optionalDependency carrying a native
      # binary; it resolves from a prebuild on ubuntu-latest, and if it ever
      # does not, the CLI tests are what will say so.
      - run: npm ci

      - run: npm test

      # Both projects. The browser one is checked with `types: []`, which is
      # what stops a `Buffer` or a `process` reaching code served to a page --
      # a failure that would otherwise typecheck cleanly and throw at runtime.
      - run: npm run typecheck

      # The site build is a real consumer of src/, so a build failure is a
      # source failure. It also proves the CSP generator can still import
      # SIGNALING_URLS, which is what keeps the allowlist honest.
      - run: npm run build

      # The app's channel of the same build. app.yml no longer runs on a
      # change under src/ -- the Rust compile never reads it -- so this is
      # now the check that a src/ change has not broken the page the app
      # ships, in seconds rather than five runners. It needs app/'s own
      # dependencies: that channel bundles app/src, which imports the Tauri API
      # and plugins from app/node_modules, and without them esbuild cannot
      # resolve @tauri-apps/plugin-dialog. The first push of this step failed
      # on exactly that, having passed on a machine that had them.
      - run: npm ci --prefix app
      - run: node scripts/build-site.mjs --channel app --out app/dist

  # The workflows themselves, and the shell inside them. publish.yml and
  # app-release.yml execute only on a tag, so without this a mistake in either
  # is found by a failed release -- after an npm publish that cannot be
  # repeated, or halfway through pushing to two package indexes.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come from mise.toml, like every other tool here. install_args
      # narrows the install to these two: a bare mise-action installs the whole
      # file, which is rust, a JDK, the Android command-line tools and
      # fdroidserver for a job that reads text.
      - uses: jdx/mise-action@v4
        with:
          install_args: actionlint shellcheck

      # actionlint directly, not `mise run lint:workflows`: `mise run` installs
      # whatever tools in mise.toml are missing before it runs a task, which is
      # the full install the step above just avoided. The task is the same one
      # word, so nothing can drift.
      - run: actionlint
