# Publishes to npm when a v* tag is pushed.
#
# Requires a repository secret NPM_TOKEN (an npm automation token). Publishing
# is gated on the full check suite: a broken release cannot be unpublished
# after 72 hours, so the tag is the wrong place to find out.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # The browser bundle ships in the tarball for <script> consumers, so it
      # has to exist before packing.
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json. Getting these
      # out of step produces a release whose version means nothing, and it is
      # a one-line check.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      # --provenance ties the published tarball to this workflow run, so a
      # consumer can verify the package was built from this repo at this commit.
      # That matters more than usual here: the whole point of self-hosting the
      # bundle was to remove a third party who could substitute code.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
