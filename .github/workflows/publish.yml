# Everything that happens when a v* tag is pushed: npm, the GitHub Release, and
# the Homebrew tap. Three jobs, in that order, each gating the next.
#
# DO NOT RENAME THIS FILE. npm Trusted Publishing is configured on npmjs.com
# against a specific repository *and workflow filename*. Renaming this to
# release.yml -- which is what it has grown into -- would typecheck, test clean,
# and then fail the next publish with a demand for a token that does not exist.
# The name is a contract with a setting held somewhere else. For the same reason
# the release and tap steps are jobs here rather than a second workflow on the
# same tag: two runs would both npm ci, both run the suite, and race the
# version check.
#
# Uses OIDC throughout: the publish job asserts its own identity to npm via
# GitHub's short-lived id-token and npm hands back a publish credential scoped
# to this one run, and the release job attests the artifacts it uploads the same
# way. No NPM_TOKEN secret exists for this repo, which means there is nothing
# here an attacker can steal to publish outside a real workflow run, and nothing
# for anyone to remember to rotate.
#
# The one secret this workflow does need is HOMEBREW_TAP_TOKEN -- see the tap
# job at the bottom.
#
# Publishing is gated on the full check suite: a broken release cannot be
# unpublished after 72 hours, so the tag is the wrong place to find out.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the release job creates a Release and uploads to it
  id-token: write # OIDC: npm trusted publishing, npm provenance, and artifact attestation
  attestations: write # build provenance for the files attached to the Release

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >=11.5.1. setup-node's bundled npm
      # tracks the Node release, not npm's, so it can lag behind that
      # floor; pin the upgrade explicitly rather than finding out on a
      # release day that the runner's npm quietly fell back to wanting a
      # token that no longer exists.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # The browser bundle ships in the tarball for <script> consumers, so it
      # has to exist before packing.
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json. Getting these
      # out of step produces a release whose version means nothing, and it is
      # a one-line check. The version is an output because the two jobs below
      # need it, and re-deriving it in each is one more place to get it wrong.
      - name: Tag must match package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      # The release notes come from CHANGELOG.md, so a tag with no entry should
      # fail here, before anything is published, rather than after -- at which
      # point the only fix is a hand-edited Release body. Cheap, and it runs
      # against the same checkout the notes are later read from.
      - name: CHANGELOG must have an entry for this version
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null

      # No NODE_AUTH_TOKEN here on purpose: with trusted publishing configured
      # for this package on npmjs.com, npm CLI >=11.5.1 detects the CI OIDC
      # environment on its own and exchanges it for a publish token, then
      # discards it. --provenance still ties the published tarball to this
      # workflow run, so a consumer can verify the package was built from
      # this repo at this commit.
      - run: npm publish --provenance --access public

  # The Release is the page people land on from the repo. v0.2.0 and v0.3.0 got
  # one by hand, with their CHANGELOG text pasted in; this makes that automatic
  # and stops the body from being a copy anyone can forget to make.
  #
  # The files are the new part -- both of those releases carry zero assets. That
  # is a concrete problem the 0.3.1 entry created: it tells self-hosters to
  # redeploy the browser bundle, and there was nowhere to download one from
  # short of unpacking the npm tarball by hand.
  release:
    needs: publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Built again rather than passed between jobs: prepublishOnly built it in
      # the publish job, on a different runner, and an artifact upload/download
      # round trip to move a directory this small is more machinery than the
      # rebuild it would replace.
      - run: npm run build

      - name: Assemble the artifacts
        run: |
          mkdir -p dist-release

          # The same tarball npm serves, so the sha256 the tap job takes below
          # is a hash of bytes a user can verify against the registry.
          npm pack --pack-destination dist-release

          # site/dist/ flat, as it is deployed. `cd` because zip records paths
          # relative to where it runs, and nobody unpacking this into a webroot
          # wants site/dist/ prefixed onto every entry.
          (cd site/dist && zip -qr "$GITHUB_WORKSPACE/dist-release/qrdrop-site-$VERSION.zip" .)

          (cd dist-release && sha256sum ./*.tgz ./*.zip > SHA256SUMS)
          cat dist-release/SHA256SUMS

      # Matches the posture `npm publish --provenance` already establishes for
      # the tarball: a consumer can check these files were produced by this
      # workflow, at this commit, rather than uploaded by hand. SHA256SUMS is
      # deliberately not attested -- it is a manifest of the two files that are,
      # and attesting a list of hashes adds nothing over attesting the things
      # hashed.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist-release/*.tgz
            dist-release/*.zip

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist-release/*

  # Homebrew is the install path for everyone on macOS and Linux who does not
  # want a global npm package. The formula lives in stan-ely/homebrew-tap and
  # points at the npm registry tarball, so this job's whole job is to move the
  # new version and its hash into it.
  #
  # HOMEBREW_TAP_TOKEN is a fine-grained PAT with contents:write scoped to the
  # tap repository and nothing else. GITHUB_TOKEN cannot stand in for it: that
  # token is scoped to this repository, and a cross-repository write is exactly
  # what it is not allowed to do. Note the tap already serves another project
  # with a secret of the same name -- secrets are per-repository, so that one is
  # not visible here and this repo needs its own.
  tap:
    needs: [publish, release]
    runs-on: ubuntu-latest
    # A prerelease should still reach npm, but it must not move the formula that
    # `brew install qrdrop` resolves to.
    if: ${{ !contains(needs.publish.outputs.version, '-') }}
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      # Hash the registry's copy, not a local `npm pack`. The formula's url
      # points at the registry, so the registry's bytes are the ones whose hash
      # has to be right -- and if the two ever disagree, this is where it should
      # be found out, not in someone's `brew install`.
      #
      # The retry loop is not defensive padding: the registry CDN takes a few
      # seconds to serve a version published one job ago, and a cold 404 here
      # would fail a release that is otherwise entirely fine.
      - name: Resolve the published tarball
        id: tarball
        run: |
          url="https://registry.npmjs.org/qrdrop/-/qrdrop-$VERSION.tgz"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$url" -o tarball.tgz; then
              sha="$(sha256sum tarball.tgz | cut -d' ' -f1)"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "sha256=$sha" >> "$GITHUB_OUTPUT"
              echo "Resolved on attempt $attempt: $sha"
              exit 0
            fi
            echo "Attempt $attempt: not on the registry CDN yet; waiting."
            sleep 15
          done
          echo "qrdrop@$VERSION never became fetchable at $url" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          repository: stan-ely/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # The formula is rewritten from this template rather than patched in
      # place, so what lands in the tap is always exactly what this workflow
      # believes it should be. A regex substitution would leave any hand edit
      # standing and silently keep it forever.
      - name: Update the formula
        env:
          TARBALL_URL: ${{ steps.tarball.outputs.url }}
          TARBALL_SHA: ${{ steps.tarball.outputs.sha256 }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/qrdrop.rb <<RUBY
          # Generated by .github/workflows/publish.yml in stan-ely/qrdrop.
          # Hand edits here are overwritten on the next release; change the
          # template in that workflow instead.
          class Qrdrop < Formula
            desc "Send a file straight from one device to another, end-to-end encrypted"
            homepage "https://github.com/stan-ely/qrdrop"
            url "$TARBALL_URL"
            sha256 "$TARBALL_SHA"
            license "MIT"

            # Rather than vendoring a runtime: brew's node is well past the
            # engines floor of 22, and a bundled Node is ~58 MB against a
            # published tarball of about 660 kB.
            depends_on "node"

            def install
              # std_npm_args passes --ignore-scripts, which is safe here for a
              # specific reason worth writing down: node-datachannel ships its
              # native binary as eight per-platform npm packages that npm picks
              # between using os/cpu, not as a postinstall that downloads one.
              # If it ever goes back to prebuild-install, this formula breaks
              # into a CLI that pairs and then cannot open a peer connection --
              # the failure src/node/rtc.js writes its long error message for.
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/qrdrop --version")
            end
          end
          RUBY
          cat tap/Formula/qrdrop.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage BEFORE asking whether anything changed. `git diff` compares
          # the index against the working tree and does not consider untracked
          # files at all, so on the release that first adds this formula it
          # reports no change and this step exits 0 having done nothing -- a
          # green tick over a no-op, which is how 0.3.1 shipped with the tap
          # left empty. `--cached` against HEAD sees an added file and a
          # modified one alike.
          git add Formula/qrdrop.rb
          if git diff --cached --quiet -- Formula/qrdrop.rb; then
            echo "Formula already at $VERSION; nothing to push."
            exit 0
          fi
          git commit -m "qrdrop $VERSION"
          git push

          # Prove the formula that is now in the tap is the one built above.
          # The failure this catches is the one that got through last time:
          # a step that reports success without the file having moved.
          git fetch origin
          if ! git diff --quiet origin/HEAD -- Formula/qrdrop.rb; then
            echo "Formula/qrdrop.rb did not land in the tap as written" >&2
            exit 1
          fi
          echo "Formula/qrdrop.rb is at $VERSION in the tap."

  # Scoop is Windows' answer to the tap job above, and it is worth saying why
  # this exists when the "No winget" note in CLAUDE.md rules that ecosystem out.
  # winget was rejected because it has no npm step and only partly honours
  # PackageDependencies, so a real package there means vendoring a ~58 MB Node
  # runtime. Scoop has neither problem: `depends` pulls nodejs from the main
  # bucket and `post_install` runs npm in the package directory -- which is the
  # same shape the Homebrew formula already has, not a new posture.
  #
  # SCOOP_BUCKET_TOKEN is the counterpart of HOMEBREW_TAP_TOKEN: a fine-grained
  # PAT with contents:write scoped to stan-ely/scoop-bucket and nothing else.
  # Re-scoping the one token to cover both taps was the alternative and was
  # rejected for the reason its own name gives -- a secret called
  # HOMEBREW_TAP_TOKEN that also writes a scoop bucket is a secret nobody can
  # reason about from the workflow that uses it.
  scoop:
    needs: [publish, release, tap]
    runs-on: ubuntu-latest
    # Same guard as tap, same reason: a prerelease reaches npm and must not move
    # what `scoop install qrdrop` resolves to.
    if: ${{ !contains(needs.publish.outputs.version, '-') }}
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      # The registry's bytes, hashed here for the same reason the tap job hashes
      # them: the manifest's url points at the registry, so that is the copy
      # whose hash has to be right. The retry loop is not needed a second time
      # -- `needs: tap` means the tarball was already fetchable one job ago.
      - name: Hash the published tarball
        id: tarball
        run: |
          curl -fsSL "https://registry.npmjs.org/qrdrop/-/qrdrop-$VERSION.tgz" -o tarball.tgz
          echo "sha256=$(sha256sum tarball.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: stan-ely/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop

      # THE .cmd WRAPPER IS NOT OPTIONAL, and it is the whole reason this
      # manifest is more than four lines. Scoop's shim generator switches on the
      # target's extension -- .exe/.com, .cmd/.bat, .ps1, .jar, .py -- and .js is
      # not among them; it falls through to a generic branch that tries to
      # translate the path for WSL or Cygwin. Pointing `bin` straight at
      # src/cli.js therefore installs cleanly, produces a shim, and fails the
      # moment anyone runs it. post_install writes a two-line cmd that execs node
      # against the same file, and `bin` shims that instead.
      #
      # --ignore-scripts mirrors std_npm_args in the Homebrew formula and is safe
      # here for the reason written out at length there: node-datachannel ships
      # its native binary as eight per-platform npm packages selected by os/cpu,
      # not as a postinstall that downloads one. If it ever goes back to
      # prebuild-install, both package managers break the same way and that
      # comment is the one to read.
      #
      # checkver and autoupdate point at the REGISTRY rather than this repo's
      # releases, because the registry is where this package's version actually
      # lives -- a GitHub tag that failed to publish should not move the
      # manifest. autoupdate deliberately carries no `hash` block: with none,
      # scoop downloads the new tarball and hashes it itself, which is what we
      # want. The registry's own `dist.shasum` is the obvious thing to point at
      # and is WRONG -- it is SHA-1, and scoop would compare it against a SHA-256
      # and refuse every update. `dist.integrity` is SHA-512 in base64 where
      # scoop wants hex.
      #
      # Built by piping JS into node through a QUOTED heredoc. Two things here
      # cannot survive shell expansion: scoop's $version and $dir placeholders,
      # which bash would empty, and the quoting inside the post_install command.
      # <<'JS' passes bytes through untouched and JSON.stringify makes malformed
      # JSON unrepresentable. `node -e '...'` was the first draft and lost a
      # Windows path's backslashes to quoting -- valid JSON, broken command,
      # which no JSON check can catch. The cmd wrapper below now uses forward
      # slashes, which cmd.exe and node both accept, so there is no backslash
      # left in this manifest to lose.
      - name: Write the scoop manifest
        env:
          TARBALL_SHA: ${{ steps.tarball.outputs.sha256 }}
        run: |
          mkdir -p scoop/bucket
          node <<'JS' > scoop/bucket/qrdrop.json
          const registry = 'https://registry.npmjs.org/qrdrop/-/qrdrop'
          process.stdout.write(JSON.stringify({
            '##': 'Generated by .github/workflows/publish.yml in stan-ely/qrdrop. Hand edits here are overwritten on the next release.',
            version: process.env.VERSION,
            description: 'Send a file straight from one device to another. A QR code carries the key; the file goes over WebRTC; nothing in between ever holds a readable copy.',
            homepage: 'https://github.com/stan-ely/qrdrop',
            license: 'MIT',
            depends: 'main/nodejs',
            url: `${registry}-${process.env.VERSION}.tgz`,
            hash: process.env.TARBALL_SHA,
            extract_dir: 'package',
            post_install: [
              'npm install --omit=dev --ignore-scripts --prefix "$dir"',
              'Set-Content -Encoding ASCII -Path "$dir/qrdrop.cmd" -Value @("@echo off", "node ""%~dp0src/cli.js"" %*")'
            ],
            bin: 'qrdrop.cmd',
            checkver: { url: 'https://registry.npmjs.org/qrdrop/latest', jsonpath: '$.version' },
            autoupdate: { url: `${registry}-$version.tgz` }
          }, null, 2) + '\n')
          JS
          cat scoop/bucket/qrdrop.json

      # Stage before asking whether anything changed, and verify after pushing,
      # for the reasons spelled out on the same block in the tap job above: a
      # `git diff` that ignores untracked files reports "no change" on the very
      # release that adds the manifest, and exits green having done nothing.
      - name: Commit and push
        working-directory: scoop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/qrdrop.json
          if git diff --cached --quiet -- bucket/qrdrop.json; then
            echo "Manifest already at $VERSION; nothing to push."
            exit 0
          fi
          git commit -m "qrdrop $VERSION"
          git push

          git fetch origin
          if ! git diff --quiet origin/HEAD -- bucket/qrdrop.json; then
            echo "bucket/qrdrop.json did not land in the bucket as written" >&2
            exit 1
          fi
          echo "bucket/qrdrop.json is at $VERSION in the bucket."
