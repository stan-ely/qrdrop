# Publishes to npm when a v* tag is pushed.
#
# Uses npm Trusted Publishing (OIDC): the job asserts its own identity to
# npm via GitHub's short-lived id-token, and npm hands back a publish
# credential that is scoped to this one run and expires with it. No
# NPM_TOKEN secret exists for this repo, which means there is nothing here
# an attacker can steal to publish outside of a real workflow run, and
# nothing for anyone to remember to rotate. The npm side of the trust (which
# repo/workflow is allowed) is configured once on npmjs.com, not in this
# file. Publishing is gated on the full check suite: a broken release
# cannot be unpublished after 72 hours, so the tag is the wrong place to
# find out.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC: both npm provenance and trusted publishing use it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >=11.5.1. setup-node's bundled npm
      # tracks the Node release, not npm's, so it can lag behind that
      # floor; pin the upgrade explicitly rather than finding out on a
      # release day that the runner's npm quietly fell back to wanting a
      # token that no longer exists.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # The browser bundle ships in the tarball for <script> consumers, so it
      # has to exist before packing.
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json. Getting these
      # out of step produces a release whose version means nothing, and it is
      # a one-line check.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN here on purpose: with trusted publishing configured
      # for this package on npmjs.com, npm CLI >=11.5.1 detects the CI OIDC
      # environment on its own and exchanges it for a publish token, then
      # discards it. --provenance still ties the published tarball to this
      # workflow run, so a consumer can verify the package was built from
      # this repo at this commit.
      - run: npm publish --provenance --access public
