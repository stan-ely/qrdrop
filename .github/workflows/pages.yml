# Builds the site and publishes it to GitHub Pages at share.stan-ely.com.
#
# ONE THING TO KNOW ABOUT THIS HOST: GitHub Pages serves no custom headers, so
# site/_headers is inert here. frame-ancestors, X-Frame-Options,
# Referrer-Policy, and Permissions-Policy will NOT be set on the deployed page.
#
# Framing is still blocked, because site/main.js refuses to run inside a frame
# -- that check exists precisely for hosts that cannot set the header, and this
# is one. The rest of those headers are defence-in-depth rather than
# load-bearing. _headers stays in the repo for anyone deploying the same build
# to Cloudflare Pages or Netlify, which do read it.
#
# The CSP itself is unaffected: it is delivered in a <meta> tag generated by
# scripts/build-site.mjs, so it survives a host that sets no headers at all.
#
# TWO BUILDS, ONE ARTIFACT. This workflow deploys the site twice over: the last
# released v* tag at /, and the tip of main at /edge/. They are built from two
# different checkouts of this repo in one clone, so each page serves exactly the
# code of the ref it names -- never main's scripts/ wrapped around a tag's src/.
#
# They ship together because a Pages deploy replaces the whole site. Splitting
# them across two workflows (this one for edge, publish.yml for stable) would
# mean whichever ran last deleted the other half, and the failure would look
# like an intermittent 404 rather than a mistake in a YAML file.
name: pages

# A tag deploys as well as a push to main, which is what makes / track releases
# rather than whatever landed an hour ago. publish.yml is on the same trigger
# and stays a separate file: its NAME is a contract with npm's trusted
# publishing (see the warning at the top of it), so nothing here may be folded
# into it and it may not be folded into this.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the stable half of the deploy is found with
      # `git describe --tags`, and the default shallow clone has no tags to
      # describe against. It is also what lets build-site.mjs read the commit
      # and date it is stamping into the footer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Gated on the suite: this deploys code that handles other people's
      # files under a promise of confidentiality, so an untested push is not
      # something to publish.
      - run: npm test
      - run: npm run typecheck

      # EDGE FIRST, and the order is load-bearing rather than stylistic. Only
      # the checkout currently on disk -- main -- has a build-site.mjs that
      # understands --channel and --out. Once this job checks out the release
      # tag below, those flags are gone, so the edge tree has to be built and
      # set aside while main is still what HEAD points at.
      - name: Build the edge tree from main
        run: node scripts/build-site.mjs --channel edge --out _site/edge

      # The last release, by tag. Empty means the repo has no v* tag at all,
      # which would otherwise fall through to building main twice and serving
      # the development build at / -- the precise thing this workflow exists to
      # stop. Fail loudly instead.
      - name: Find the latest release tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' || true)
          if [ -z "$TAG" ]; then
            echo "No v* tag found -- refusing to deploy main as the stable site." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Stable site will be built from $TAG"

      # A second npm ci, not an optimisation to skip: the tag has its own
      # package-lock.json, and installing main's dependencies around a tag's
      # source is the same frankenbuild this workflow set out to avoid.
      #
      # The suite runs again here for the same reason it ran above -- this is a
      # different tree, and "it passed when it was tagged" is a claim about a
      # different runner on a different day.
      - name: Build the stable tree from the release tag
        run: |
          git checkout --detach "${{ steps.tag.outputs.tag }}"
          npm ci
          npm test
          npm run typecheck
          node scripts/build-site.mjs

      # site/dist/* into the root of _site/, leaving _site/edge/ where it is.
      # cp -R of the contents rather than the directory, so this does not
      # produce _site/dist/.
      #
      # The stable build writes CNAME (the file that binds the custom domain)
      # and the edge build deliberately does not, so the artifact ends up with
      # exactly one, at its root, which is the only place Pages reads it. The
      # rm is for an edge tree built by some older revision of the script that
      # wrote one anyway: a stray CNAME in a subdirectory is inert, but it
      # looks like a second binding to whoever finds it next.
      - name: Assemble the deploy
        run: |
          cp -R site/dist/. _site/
          rm -f _site/edge/CNAME
          test -f _site/CNAME || { echo "_site/CNAME missing -- the custom domain would unbind." >&2; exit 1; }
          test -f _site/edge/index.html || { echo "_site/edge/index.html missing." >&2; exit 1; }

      - uses: actions/configure-pages@v6

      # _site/ contains the CNAME file that binds the custom domain, copied up
      # from the stable build by the step above.
      #
      # v4 of this action stopped including hidden files in the artifact.
      # Nothing in _site/ is one -- CNAME and _headers both start with a
      # visible character -- so the upgrade past it is a no-op here. If a
      # dotfile ever does need to ship (a .well-known/ directory being the
      # likely reason), it will vanish from the deploy silently, and the fix
      # is include-hidden-files: true rather than a downgrade.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
