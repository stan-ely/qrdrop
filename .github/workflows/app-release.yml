# Everything that happens when an `app-v*` tag is pushed: the desktop bundles,
# a signed Android APK, and the GitHub Release that carries them.
#
# A separate file from app.yml, which stays build-only, and a separate file
# from publish.yml, which is the npm side. The tag namespaces do not collide
# and the reason is worth stating because it is the fact that makes this file
# safe to add: a workflow's `tags:` glob is anchored at the start, so `v*`
# matches `v0.3.1` and does NOT match `app-v0.1.0`. publish.yml and pages.yml
# therefore stay out of an app release entirely. Putting the prefix on the
# front rather than the back is what buys that; `0.1.0-app` would have matched
# `v*` no better than it matches anything, and an app release would have
# started an npm publish.
#
# Nothing here is a rewrite of publish.yml -- it borrows that file's shape
# deliberately: check the version and the changelog BEFORE building anything,
# build the artifacts, attest them, and assemble one Release with checksums.
# The differences are all about signing, and they are the honest kind.
name: app release

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write # the release job creates a Release and uploads to it
  id-token: write # OIDC, for the build provenance attestation below
  attestations: write

jobs:
  # Cheap, and first. A tag that disagrees with the crate version, or that has
  # no changelog entry, should cost seconds rather than three cold Rust builds
  # -- and it should fail while the tag can still be deleted and re-cut, not
  # after a Release page exists.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # app/src-tauri/Cargo.toml is the app's single source of truth (see the
      # comment on `version` there). tauri.conf.json omits its own version
      # field so Tauri reads the crate's, and app/package.json is deliberately
      # left at 0.0.0 -- so this is the one number to compare the tag against.
      - name: Tag must match the crate version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#app-v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "Tag app-v$tag does not match app/src-tauri/Cargo.toml $crate" >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - name: The app changelog must have an entry for this version
        run: node scripts/release-notes.mjs --file app/CHANGELOG.md "${{ steps.version.outputs.version }}" > /dev/null

      # The Microsoft Store package's version is the crate version with `.0`
      # appended and nothing else, and the Store forbids a first part of 0. So a
      # 0.x crate has no Store package, and this is where that should fail: in
      # seconds, on a Linux runner, rather than on the Windows leg below after a
      # cold Rust build. scripts/make-msix.mjs explains why it is refused rather
      # than mapped onto another number. A prerelease never goes to the Store,
      # so it is not asked.
      - name: The crate version must be one the Microsoft Store can carry
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        run: node scripts/make-msix.mjs --check

  desktop:
    needs: check
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
      - run: npm ci --prefix app
      - run: mise run app:build-site
      - run: mise run app:config

      # A real bundle, unlike app.yml's `--debug --no-bundle`: this is the
      # artifact people install, so it is release codegen and it goes through
      # the installer targets in tauri.conf.json (nsis, deb, appimage, dmg).
      #
      # UNSIGNED, on all three. There is no Windows code-signing certificate
      # and no Apple Developer account, so macOS will quarantine the .dmg and
      # SmartScreen will warn about the installer. The release notes say so
      # plainly rather than leaving people to meet it cold -- see the Release
      # body assembled below.
      - run: npx tauri build
        working-directory: app

      # The portable Windows build, for Scoop. Scoop installs into a directory
      # it owns and does not run installers, so it needs the binary rather than
      # the NSIS package.
      #
      # Extracting the NSIS .exe with 7-Zip is the shortcut and it is the wrong
      # one: what comes out is $PLUGINSDIR and an internal layout that belongs
      # to the installer generator, not to us, so a manifest built on it breaks
      # on an nsis-plugin change with nothing to read in the diff. Zipping the
      # binary we already built costs a step and cannot drift.
      #
      # qrdrop.exe by name because the crate is `name = "qrdrop"` and
      # tauri.conf.json sets no mainBinaryName -- the bundles are named from
      # productName, the binary is named from Cargo.
      #
      # The one thing this loses against the installer: the NSIS package
      # downloads the Evergreen WebView2 runtime when it is missing and a zip
      # cannot. That is Windows 11 and Windows 10 21H2 or later out of the box,
      # and the Release body says so.
      - name: Zip the portable Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp app/src-tauri/target/release/qrdrop.exe portable/
          (cd portable && 7z a "$GITHUB_WORKSPACE/qrdrop-${{ needs.check.outputs.version }}-x86_64-windows.zip" qrdrop.exe)

      # The Microsoft Store package: the same qrdrop.exe again, in an MSIX. An
      # MSIX and not the NSIS installer because only an MSIX is re-signed by the
      # Store -- an EXE or MSI submission must arrive signed by a trusted CA,
      # which this project has no certificate for. See CLAUDE.md, "The
      # Microsoft Store".
      #
      # UNSIGNED, and a WORKFLOW ARTIFACT rather than a Release asset. An
      # unsigned MSIX will not install from a download, so offering it on the
      # Release page would be offering a file that cannot be used; it exists to
      # be uploaded to Partner Center. It stays off that page because the
      # release job copies files by extension and .msix is not among them.
      - name: Pack the Microsoft Store MSIX
        if: matrix.os == 'windows-latest' && !contains(needs.check.outputs.version, '-')
        run: node scripts/make-msix.mjs --out "qrdrop-${{ needs.check.outputs.version }}-x64.msix"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && !contains(needs.check.outputs.version, '-')
        with:
          name: store-msix
          if-no-files-found: error
          path: qrdrop-*-x64.msix

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg
            qrdrop-*-x86_64-windows.zip

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: mise run app:android:sdk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # All four ABIs here, unlike app.yml's single arm64. That job asks "does
      # it link"; this one produces the file people install, and a universal
      # APK that refuses to run on a 32-bit or x86 device is a support burden
      # for a build that costs minutes.
      - run: mise run app:android:targets

      - run: npm ci
      - run: npm ci --prefix app
      - run: mise run app:build-site
      - run: mise run app:config

      # The signing key, for the length of this job. gen/android's
      # build.gradle.kts reads keystore.properties if it is there and produces
      # an unsigned release APK if it is not, so a fork or a re-run without
      # the secrets fails at the verify step below rather than silently
      # shipping something nobody can install.
      #
      # Written into RUNNER_TEMP, not the workspace: the workspace is what
      # upload-artifact walks, and a keystore that ends up in a release asset
      # is not a mistake anyone gets to make twice.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set -- an app release cannot ship an unsigned APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qrdrop-release.jks"
          cat > app/src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/qrdrop-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: npx tauri android build --apk
        working-directory: app

      # Prove the signature rather than assume it. The gradle config is
      # conditional on keystore.properties existing, which is what keeps a
      # keyless local build working -- and that same conditional is exactly
      # how an unsigned APK could reach a Release without anything failing.
      # apksigner reports the certificate, so this also puts the fingerprint
      # in the log next to the one in assetlinks.json.
      - name: Verify the APK is signed, and log its certificate
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)"
          echo "Verifying $apk"
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*-release*.apk

  release:
    needs: [check, desktop, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: staging

      # Flattened out of the per-job directories: a release asset list is a
      # list of files, and staging/desktop-macos-latest/... in the middle of
      # one tells a downloader nothing they cannot see from the extension.
      - name: Assemble the artifacts
        run: |
          mkdir -p dist-release
          find staging -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.apk' -o -name '*.zip' \) \
            -exec cp {} dist-release/ \;
          # Bare names, not ./*. Scoop's autoupdate reads this file to find the
          # hash of the artifact it is about to point at, matching on the
          # filename, and its default pattern expects `<hash>  <basename>` --
          # the conventional shape. A leading ./ is invisible to `sha256sum -c`
          # and silently defeats that match. `--` rather than ./* for the same
          # reason: it stops a name starting with a dash reading as an option
          # and leaves every name in the output bare.
          (cd dist-release && sha256sum -- * > SHA256SUMS)
          cat dist-release/SHA256SUMS

      # The same posture publish.yml establishes for the npm tarball: a
      # consumer can check these files came out of this workflow at this
      # commit. It is not a code signature and does not stand in for one --
      # the OS will still warn -- but it is a verifiable claim about origin,
      # which is more than an unsigned installer carries on its own.
      # SHA256SUMS is not attested: it is a manifest of files that are.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.deb
            dist-release/*.AppImage
            dist-release/*.dmg
            dist-release/*.apk
            dist-release/*.zip

      # The changelog entry is the notes, extracted not generated (see
      # scripts/release-notes.mjs). What is appended is the part that belongs
      # to the artifacts rather than to the version: which of them are signed,
      # what each OS will say about the ones that are not, and how to check
      # the download against SHA256SUMS. An unsigned build that arrives with
      # no warning teaches people to click through the dialog that a tool
      # about authenticating the other end most needs them to read.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs --file app/CHANGELOG.md "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ---

          ### Installing

          ```
          brew install --cask stan-ely/tap/qrdrop-app          # macOS, Apple silicon
          scoop bucket add stan-ely https://github.com/stan-ely/scoop-bucket
          scoop install stan-ely/qrdrop-app                     # Windows
          ```

          Both resolve to the files below, and both are updated by this workflow.
          Everything else on this page is a direct download.

          On **Android**, add this project's own F-Droid repository once and the
          client offers every future release as an ordinary update:

          ```
          https://share.stan-ely.com/fdroid/repo?fingerprint=889603b768cd2ca50f6c553086827880aa1aad5bbf0098a3028a7f1b7fd47582
          ```

          It serves the same APK this page does, signed with the same key --
          not rebuilt and re-signed by F-Droid. That is what keeps a scanned
          pairing code opening the app instead of a browser tab; see below.

          ### About these files

          `qrdrop-<version>-x86_64-windows.zip` is the portable Windows build --
          the same binary the installer carries, with no installer around it.
          It is what Scoop installs. Unlike the `.exe`, it cannot fetch the
          **Evergreen WebView2 runtime** if your machine has none; that ships
          with Windows 11 and Windows 10 21H2 or later, so this only matters on
          something older.

          The **Android APK** is signed with the project's release key. Its
          certificate fingerprint is the one published at
          `https://share.stan-ely.com/.well-known/assetlinks.json`, which is what
          lets a scanned pairing code open the app instead of a browser tab.

          The **desktop installers are not signed.** There is no Windows
          code-signing certificate and no Apple Developer account behind this
          project, so:

          - **macOS** will refuse the `.dmg` as being from an unidentified
            developer. `xattr -d com.apple.quarantine /Applications/qrdrop.app`
            after installing, if you decide to trust it.
          - **Windows** SmartScreen will warn about the installer. "More info",
            then "Run anyway", if you decide to trust it.

          Those warnings are accurate: nobody has vouched for these binaries.
          Verify what you downloaded against `SHA256SUMS` first, and note that
          every file here carries a build provenance attestation you can check
          with `gh attestation verify <file> --repo stan-ely/qrdrop`.

          **iOS is not here.** It is compiled on every change and is proven to
          link, but shipping it needs an Apple Developer account.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "qrdrop app $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            dist-release/*

  # The two package managers, updated from the Release that job just made.
  #
  # A Homebrew CASK rather than a formula: this installs a .app bundle, not a
  # binary built from source. Casks live in Casks/ in the same tap that already
  # carries Formula/qrdrop.rb, and the two are named apart -- qrdrop is the CLI,
  # qrdrop-app is this. A formula and a cask sharing one token in one tap is
  # legal and makes `brew install qrdrop` warn and quietly resolve to the
  # formula, which is a trap for whoever typed the other one.
  #
  # Two secrets because there are two taps: HOMEBREW_TAP_TOKEN is the fine-
  # grained PAT publish.yml already uses, and SCOOP_BUCKET_TOKEN is its
  # counterpart scoped to stan-ely/scoop-bucket. Widening one PAT to cover both
  # was the alternative and was rejected: its name would then say less than it
  # opens, and one leaked token would move two package indexes instead of one.
  tap:
    needs: [check, release]
    runs-on: ubuntu-latest
    # A prerelease should still get a Release page, but it must not move what
    # `brew install` and `scoop install` resolve to. Same guard, same reason as
    # publish.yml's tap job.
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      # Hash what the manifests point at, not what the release job had on disk.
      # It is the same reasoning publish.yml's tap job writes down about hashing
      # the registry's tarball rather than a local `npm pack`: the URL in a
      # manifest is what somebody's install actually fetches, so those are the
      # bytes whose hash has to be right, and if the two ever disagree this is
      # the place to find out.
      - name: Hash the published artifacts
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retried, six attempts fifteen seconds apart, the same loop
          # publish.yml uses to resolve the npm tarball. A release asset is
          # served through a CDN that has occasionally not caught up with a
          # Release created one job earlier, and a cold 404 here fails an
          # otherwise fine release at the last step -- after the Release page
          # exists, which is the expensive place to fail.
          fetch_asset() {
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL "$BASE/$1" -o "$1"; then
                echo "Fetched $1 on attempt $attempt."
                return 0
              fi
              echo "Attempt $attempt: $1 is not servable yet; waiting."
              sleep 15
            done
            echo "$1 never became fetchable at $BASE/$1" >&2
            return 1
          }
          dmg="qrdrop_${VERSION}_aarch64.dmg"
          zip="qrdrop-${VERSION}-x86_64-windows.zip"
          fetch_asset "$dmg"
          fetch_asset "$zip"
          {
            echo "dmg=$dmg"
            echo "zip=$zip"
            echo "dmg_sha=$(sha256sum "$dmg" | cut -d' ' -f1)"
            echo "zip_sha=$(sha256sum "$zip" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: stan-ely/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: brew

      - uses: actions/checkout@v7
        with:
          repository: stan-ely/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop

      # arm64 only, and `depends_on arch:` is what makes that a refusal rather
      # than a broken install. macos-latest is an Apple-silicon runner and the
      # desktop job builds exactly one dmg from it, so without this stanza an
      # Intel Mac installs a bundle that cannot launch and says nothing useful
      # about why. Building an x86_64 dmg as well was the alternative: a cold
      # second Rust build every release, for hardware Apple no longer sells.
      #
      # The caveats are not optional politeness. `brew install --cask` applies
      # the quarantine attribute, so this app -- which nobody has signed -- will
      # be refused on first launch. The Release body explains that to anyone who
      # downloads the dmg by hand; a tap that installs the same bytes silently
      # would be routing people around the one warning this project goes out of
      # its way to make legible.
      - name: Write the cask
        env:
          DMG: ${{ steps.hash.outputs.dmg }}
          DMG_SHA: ${{ steps.hash.outputs.dmg_sha }}
        run: |
          mkdir -p brew/Casks
          cat > brew/Casks/qrdrop-app.rb <<RUBY
          # Generated by .github/workflows/app-release.yml in stan-ely/qrdrop.
          # Hand edits here are overwritten on the next release; change the
          # template in that workflow instead.
          cask "qrdrop-app" do
            version "$VERSION"
            sha256 "$DMG_SHA"

            url "$BASE/$DMG",
                verified: "github.com/stan-ely/qrdrop/"
            name "qrdrop"
            desc "Send a file straight from one device to another, end-to-end encrypted"
            homepage "https://github.com/stan-ely/qrdrop"

            # The desktop job builds one dmg, on an Apple-silicon runner.
            depends_on arch: :arm64
            depends_on macos: ">= :big_sur"

            app "qrdrop.app"

            zap trash: [
              "~/Library/Saved Application State/com.stan-ely.qrdrop.savedState",
              "~/Library/WebKit/com.stan-ely.qrdrop",
            ]

            caveats <<~EOS
              qrdrop is not code-signed. There is no Apple Developer account behind
              this project, so macOS will refuse to open it the first time and say
              it cannot check the app for malicious software.

              If you decide to trust it:

                xattr -d com.apple.quarantine /Applications/qrdrop.app

              That warning is accurate -- nobody has vouched for this binary. The
              dmg does carry a build provenance attestation, which is a verifiable
              claim about where it was built and not a signature:

                gh attestation verify <file> --repo stan-ely/qrdrop
            EOS
          end
          RUBY
          cat brew/Casks/qrdrop-app.rb

      # Built by piping JS into node through a QUOTED heredoc, and both halves
      # of that are load-bearing. A scoop manifest's autoupdate block is written
      # in scoop's own placeholders -- $version, $basename -- which are bash
      # variables too, so an unquoted heredoc silently empties them; <<'JS'
      # passes bytes through untouched. Building the object in JS and
      # JSON.stringify-ing it is what makes invalid JSON unrepresentable.
      #
      # The first draft of this step used `node -e '...'` and lost the
      # backslashes out of a Windows path to shell quoting. That produced
      # perfectly valid JSON containing a broken command, which is a failure no
      # amount of JSON checking can see.
      #
      # `shortcuts` is the stanza that matters for a GUI app -- it is what puts
      # qrdrop in the Start Menu. A bare `bin` shim is right for a CLI and would
      # leave this installed with no way to launch it but a path.
      #
      # checkver carries an explicit app-v regex because the default github
      # strategy reads whatever release is newest, and this repository
      # alternates npm tags with app tags -- left to itself scoop's updater
      # would resolve v0.4.0 and build a download URL for a release that has no
      # such file.
      - name: Write the scoop manifest
        env:
          ZIP: ${{ steps.hash.outputs.zip }}
          ZIP_SHA: ${{ steps.hash.outputs.zip_sha }}
        run: |
          mkdir -p scoop/bucket
          node <<'JS' > scoop/bucket/qrdrop-app.json
          const releases = 'https://github.com/stan-ely/qrdrop/releases/download'
          process.stdout.write(JSON.stringify({
            '##': 'Generated by .github/workflows/app-release.yml in stan-ely/qrdrop. Hand edits here are overwritten on the next release.',
            version: process.env.VERSION,
            description: 'Send a file straight from one device to another, end-to-end encrypted',
            homepage: 'https://github.com/stan-ely/qrdrop',
            license: 'MIT',
            architecture: {
              '64bit': { url: `${process.env.BASE}/${process.env.ZIP}`, hash: process.env.ZIP_SHA }
            },
            bin: 'qrdrop.exe',
            shortcuts: [['qrdrop.exe', 'qrdrop']],
            checkver: { github: 'https://github.com/stan-ely/qrdrop', regex: 'app-v([0-9.]+)' },
            autoupdate: {
              architecture: {
                '64bit': {
                  url: `${releases}/app-v$version/qrdrop-$version-x86_64-windows.zip`,
                  hash: { url: `${releases}/app-v$version/SHA256SUMS` }
                }
              }
            }
          }, null, 2) + '\n')
          JS
          cat scoop/bucket/qrdrop-app.json

      # The staging order below is deliberate and is copied from publish.yml's
      # tap job rather than reinvented. `git diff` compares the index against
      # the working tree and ignores untracked files entirely, so on the release
      # that first ADDS a file it reports no change and the step exits 0 having
      # done nothing -- a green tick over a no-op, which is exactly how 0.3.1
      # shipped with the tap left empty. Staging first, then --cached against
      # HEAD, sees an added file and a modified one alike. The fetch-and-diff
      # afterwards proves the file that is now in the tap is the one written
      # above.
      - name: Commit and push
        run: |
          push_one() {
            dir="$1"; file="$2"
            cd "$GITHUB_WORKSPACE/$dir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file"
            if git diff --cached --quiet -- "$file"; then
              echo "$dir/$file already at $VERSION; nothing to push."
              return 0
            fi
            git commit -m "qrdrop-app $VERSION"
            git push
            git fetch origin
            if ! git diff --quiet origin/HEAD -- "$file"; then
              echo "$file did not land in $dir as written" >&2
              return 1
            fi
            echo "$file is at $VERSION in $dir."
          }
          push_one brew Casks/qrdrop-app.rb
          push_one scoop bucket/qrdrop-app.json

  # winget, from the Release like the two taps above, as `Stan-Ely.qrdrop-app`.
  #
  # FULL MANIFESTS, generated here and handed to `wingetcreate submit`, rather
  # than `wingetcreate update`. update copies the previous version's manifests
  # and rewrites the URL and hash, but AppsAndFeaturesEntries.DisplayVersion and
  # ReleaseNotesUrl come along untouched -- and a stale DisplayVersion does not
  # break `winget install`, it breaks `winget upgrade`, silently, a release
  # later. update also fails outright on a package winget-pkgs does not have
  # yet, where submit opens a new-package PR. So these are written in full every
  # release, the same posture as the cask and the scoop manifest.
  #
  # Its own job, on Windows, because wingetcreate is a Windows executable.
  # WINGET_PKGS_TOKEN is a classic PAT with public_repo: submit forks
  # microsoft/winget-pkgs into the token owner's account and opens the PR from
  # there, which a fine-grained token scoped to one repository cannot do.
  #
  # The Microsoft Store is a separate route and does not replace this one:
  # `winget install --source msstore` resolves the Store's signed MSIX, this
  # resolves the unsigned NSIS installer on the Release page.
  winget:
    needs: [check, release]
    runs-on: windows-latest
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      # Hash what the manifest points at, for the reason the tap job gives, and
      # with the same retry for the same CDN lag.
      - name: Hash the published installer
        id: hash
        shell: bash
        run: |
          exe="qrdrop_${VERSION}_x64-setup.exe"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL "$BASE/$exe" -o "$exe" && break
            echo "Attempt $attempt: $exe is not servable yet; waiting."
            sleep 15
          done
          test -s "$exe" || { echo "$exe never became fetchable at $BASE/$exe" >&2; exit 1; }
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Piped JS through a QUOTED heredoc, as the scoop manifest is, and every
      # scalar goes through JSON.stringify: a JSON string is a valid YAML
      # double-quoted scalar, so a value can never end a line early or turn into
      # a different type. The fixed parts were measured when 0.1.0 was seeded
      # by hand, and each one names what breaks without it:
      #
      #   InstallerType nullsoft -- winget supplies /S and /D= itself; a
      #     hand-written InstallerSwitches block would be a second copy of that.
      #   Scope user -- tauri.conf.json sets no bundle.windows.nsis block, and
      #     NSISInstallerMode defaults to CurrentUser; the 0.1.0 installer wrote
      #     its uninstall key under HKCU and nothing under HKLM.
      #   ProductCode qrdrop -- the uninstall key's name, read back after a
      #     silent install. Wrong, it does not break install; it breaks upgrade.
      #   No Publisher in AppsAndFeaturesEntries -- the installer writes
      #     "stan-ely" (from the bundle identifier) and the locale says
      #     "Bevan Stanely"; ProductCode alone correlates exactly.
      - name: Write the manifests
        id: manifests
        shell: bash
        env:
          EXE: ${{ steps.hash.outputs.exe }}
          SHA: ${{ steps.hash.outputs.sha }}
        run: |
          dir="manifests/s/Stan-Ely/qrdrop-app/$VERSION"
          mkdir -p "$dir"
          DIR="$dir" node <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const { VERSION, BASE, EXE, SHA, DIR } = process.env
          const q = JSON.stringify
          const id = 'Stan-Ely.qrdrop-app'
          const header = (schema) => [
            `# yaml-language-server: $schema=https://aka.ms/winget-manifest.${schema}.1.10.0.schema.json`,
            '# Generated by .github/workflows/app-release.yml in stan-ely/qrdrop.',
            `PackageIdentifier: ${id}`,
            `PackageVersion: ${q(VERSION)}`,
          ]
          const write = (name, lines) => fs.writeFileSync(path.join(DIR, name), lines.join('\n') + '\n')

          write(`${id}.yaml`, [
            ...header('version'),
            'DefaultLocale: en-US',
            'ManifestType: version',
            'ManifestVersion: 1.10.0',
          ])

          write(`${id}.installer.yaml`, [
            ...header('installer'),
            'InstallerType: nullsoft',
            'Scope: user',
            'InstallModes:',
            '  - interactive',
            '  - silent',
            '  - silentWithProgress',
            'UpgradeBehavior: install',
            `ReleaseDate: ${q(new Date().toISOString().slice(0, 10))}`,
            'AppsAndFeaturesEntries:',
            '  - DisplayName: qrdrop',
            `    DisplayVersion: ${q(VERSION)}`,
            '    ProductCode: qrdrop',
            '    InstallerType: nullsoft',
            'Installers:',
            '  - Architecture: x64',
            `    InstallerUrl: ${q(`${BASE}/${EXE}`)}`,
            `    InstallerSha256: ${SHA.toUpperCase()}`,
            'ManifestType: installer',
            'ManifestVersion: 1.10.0',
          ])

          const description = [
            'qrdrop sends a file straight from one device to another. The file is encrypted',
            'end to end and never touches a server: pairing happens by scanning a QR code or',
            'reading out a short code, and the transfer itself runs peer to peer. Before',
            "anything is sent, both ends show the same short emoji phrase and each person",
            "confirms the other's out loud, so a stranger who has the pairing code still",
            'cannot get in the middle without one of you noticing.',
            '',
            'There is also Beam, which moves a file as animated QR codes across a camera and',
            'needs no network at all.',
            '',
            'This installer is NOT code-signed. There is no Windows code-signing certificate',
            'behind this project, so SmartScreen may warn about it. That warning is accurate:',
            'nobody has vouched for this binary. It does carry a build provenance attestation,',
            'which is a verifiable claim about where it was built and not a signature:',
            '',
            '  gh attestation verify <file> --repo stan-ely/qrdrop',
          ].join('\n')

          write(`${id}.locale.en-US.yaml`, [
            ...header('defaultLocale'),
            'PackageLocale: en-US',
            'Publisher: Bevan Stanely',
            'PublisherUrl: https://github.com/stan-ely',
            'PublisherSupportUrl: https://github.com/stan-ely/qrdrop/issues',
            'Author: Bevan Stanely',
            'PackageName: qrdrop',
            'PackageUrl: https://github.com/stan-ely/qrdrop',
            'License: MIT',
            'LicenseUrl: https://github.com/stan-ely/qrdrop/blob/main/LICENSE',
            'Copyright: Copyright (c) Bevan Stanely',
            'ShortDescription: Send a file straight from one device to another, end-to-end encrypted',
            `Description: ${q(description)}`,
            'Moniker: qrdrop',
            'Tags:',
            ...['file-transfer', 'p2p', 'encryption', 'end-to-end-encryption', 'qr-code', 'webrtc', 'airdrop', 'sharing'].map((t) => `  - ${t}`),
            `ReleaseNotesUrl: ${q(`https://github.com/stan-ely/qrdrop/releases/tag/app-v${VERSION}`)}`,
            'ManifestType: defaultLocale',
            'ManifestVersion: 1.10.0',
          ])
          JS
          for f in "$dir"/*; do echo "== $f"; cat "$f"; done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # A re-run of this job must not open a second PR for the same version,
      # and winget-pkgs moderators close duplicates by hand. So look first,
      # across open and closed, by the title submit is about to use.
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          DIR: ${{ steps.manifests.outputs.dir }}
        run: |
          $title = "Stan-Ely.qrdrop-app version $env:VERSION"
          $existing = gh pr list --repo microsoft/winget-pkgs --state all --search "`"$title`" in:title" --json number,state,url | ConvertFrom-Json
          if ($existing) {
            "A PR for $title already exists, so nothing is submitted:"
            $existing | Format-Table
            exit 0
          }
          if (-not $env:WINGET_PKGS_TOKEN) { throw 'WINGET_PKGS_TOKEN is not set -- winget-pkgs cannot be updated.' }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --no-open --prtitle $title --token $env:WINGET_PKGS_TOKEN $env:DIR
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit exited $LASTEXITCODE" }

  # The F-Droid repository, regenerated from this Release and force-pushed to
  # the fdroid-repo branch, from which pages.yml copies it into the deployed
  # site at /fdroid/repo.
  #
  # A BINARY repository serving our own release-signed APK, not an f-droid.org
  # listing -- fdroid/config.yml's header carries the reasoning, and it is the
  # whole point: an F-Droid-built app is signed with F-Droid's key, whose
  # fingerprint is not the one at .well-known/assetlinks.json, so every install
  # from such a build would open a browser tab instead of the app on a scanned
  # pairing code, with nothing anywhere to read about why.
  #
  # TWO KEYS, and they are not interchangeable. ANDROID_KEYSTORE_BASE64 signs
  # the APK and says "this is qrdrop" to Android. FDROID_KEYSTORE_BASE64 signs
  # entry.jar and index-v2.json and says "this is the qrdrop repository" to the
  # F-Droid client, which PINS that certificate the moment a user adds the repo
  # and refuses an index signed by any other one. It therefore cannot be
  # rotated: the only recovery from losing it is asking every user to remove
  # and re-add the repository. Entangling it with the app key would tie an
  # unrotatable identity to a key that may one day have to be replaced.
  fdroid:
    needs: [check, release]
    runs-on: ubuntu-latest
    # Same guard, same reason as tap: a prerelease gets a Release page but must
    # not move what an installed F-Droid client is offered as an update.
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # An F-Droid repository is CUMULATIVE: the index describes every APK
      # present, and a client offering an older release needs that APK still
      # downloadable from the same directory. Regenerating from this release's
      # APK alone would silently drop every previous version from the index on
      # the first release after this one -- and a version that vanishes from an
      # index is not an error anywhere, it is just gone.
      - uses: actions/checkout@v7
        with:
          ref: fdroid-repo
          path: published

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # apksigner is what fdroidserver uses to read an APK's signature. Without
      # it the tool falls back to jarsigner, which cannot see an APK Signature
      # v2 block -- the only scheme our release APK carries -- and concludes the
      # jar is unsigned, then moves the APK to archive/ and publishes an empty
      # repository. That failure is a warning in the log and a green job.
      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner
          pipx install fdroidserver==2.4.5
          fdroid --version
          # `fdroid update` shells out to `jar cf` to build index-v1.jar, so a
          # JRE is not enough. The runner image ships a JDK; assert it rather
          # than discover it as a stack trace.
          command -v jar >/dev/null || { echo "no jar on PATH -- fdroid update cannot build index-v1.jar" >&2; exit 1; }

      # The APK filename is read from SHA256SUMS and never spelled here, for
      # the reason the release job globs rather than naming: SHA256SUMS is
      # generated by `sha256sum *` over the very directory that was uploaded,
      # so it cannot disagree with the Release by construction. The sed strips
      # a leading ./ because app-v0.1.0 shipped this file with ./ prefixes and
      # the bare-name change landed after it -- tolerating both costs one sed
      # and means this does not depend on which release it is reading.
      - name: Fetch and verify the published APK
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL "$BASE/SHA256SUMS" -o SHA256SUMS && break
            echo "Attempt $attempt: SHA256SUMS is not servable yet; waiting."
            sleep 15
          done
          test -s SHA256SUMS || { echo "SHA256SUMS never became fetchable at $BASE" >&2; exit 1; }
          matches="$(awk '$2 ~ /[.]apk$/ {print $2}' SHA256SUMS | sed 's|^[.]/||')"
          count="$(printf '%s\n' "$matches" | grep -c .)"
          if [ "$count" != "1" ]; then
            echo "Expected exactly one .apk in SHA256SUMS, found $count -- picking one would be a coin toss resolved in favour of whatever sha256sum sorted first:" >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi
          curl -fsSL "$BASE/$matches" -o "$matches"
          # Checked against the published SHA256SUMS, so the bytes going into a
          # signed index are the bytes the Release page actually serves.
          sed 's|  [.]/|  |' SHA256SUMS | grep "  $matches\$" > apk.sha256
          sha256sum -c apk.sha256
          mkdir -p fdroid/repo
          # Renamed on the way in: the release asset is app-universal-release.apk
          # with no version in its name, and this directory holds several
          # releases at once.
          mv "$matches" "fdroid/repo/qrdrop-$VERSION.apk"

      # Carry every previous APK forward, then keep the newest three. That is a
      # size decision about one git branch and not a correctness one -- the
      # branch is force-pushed as a fresh orphan commit every release, but each
      # APK is ~43 MB and pages.yml clones this on every single site deploy.
      - name: Carry previous releases forward
        run: |
          if [ -d published/repo ]; then
            cp -n published/repo/*.apk fdroid/repo/ 2>/dev/null || true
          fi
          printf '%s\n' fdroid/repo/*.apk | sort -V | head -n -3 | xargs -r rm -v
          ls -l fdroid/repo/

      # RUNNER_TEMP, never the workspace. The workspace is what gets built into
      # the branch that is force-pushed to a public repository and served from
      # a Pages site, and a repository signing key published at a URL is not a
      # mistake anyone gets to make twice. config.yml reads all four values
      # through {env:} substitution so no password reaches a file here either.
      - name: Restore the repository signing keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "FDROID_KEYSTORE_BASE64 is not set -- the index cannot be signed, and an unsigned index is a repository no client will add." >&2
            exit 1
          fi
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qrdrop-fdroid-repo.p12"

      # icon.png is copied in rather than committed at repo/icons/icon.png,
      # because `fdroid update` owns that directory and overwrites the file
      # there with a generated placeholder. fdroid/icon.png is the source.
      - name: Build and sign the index
        working-directory: fdroid
        env:
          FDROID_KEYSTORE: ${{ runner.temp }}/qrdrop-fdroid-repo.p12
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          mkdir -p repo/icons
          cp icon.png repo/icons/icon.png
          fdroid update --verbose --pretty

      # Each assertion names its consequence, because none of these fail
      # loudly on their own. A missing index is not a 404 anyone reports: the
      # client shows the repository as present and EMPTY, which reads as "no
      # releases yet".
      - name: The index must exist and must describe this release
        working-directory: fdroid
        run: |
          test -f repo/entry.jar || { echo "no repo/entry.jar -- the index is unsigned and no client will accept the repository." >&2; exit 1; }
          test -f repo/index-v2.json || { echo "no repo/index-v2.json -- clients would show the repository as present and empty, which reads as 'no releases yet'." >&2; exit 1; }
          grep -q "qrdrop-$VERSION.apk" repo/index-v2.json || { echo "the index does not mention qrdrop-$VERSION.apk -- fdroid update rejected the APK, most likely because it could not read its signature, and this release would be invisible to every client." >&2; exit 1; }
          ls -l repo/

      # push_one from the tap job deliberately does not carry over. Three
      # reasons: a regenerated repo/ can LOSE files and `git add <dir>` does not
      # stage a deletion; the target is a named branch of this repository rather
      # than another repository's HEAD; and every release adds a ~43 MB APK
      # blob, so ordinary history would grow by that much per release forever
      # and pages.yml would pay for all of it on every site deploy.
      #
      # So the branch is a CACHE OF BYTES, not a history: a fresh orphan commit,
      # force-pushed. That is safe precisely because nothing on it is a source
      # of truth -- the APKs are on the Releases page, the metadata is on main,
      # and the index is reproducible from the two.
      #
      # github.token, not a PAT: the doctrine about one fine-grained PAT per
      # index is about CROSS-repository writes, and this is a branch of this
      # repository.
      - name: Force-push the repository to fdroid-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP/fdroid-branch"
          rm -rf "$work"
          mkdir -p "$work"
          cp -R fdroid/repo "$work/repo"
          cd "$work"
          # The guard that must never be removed. Everything below is about to
          # be public, permanently, at a URL.
          if find . -name '*.p12' -o -name '*.jks' -o -name '*.keystore' | grep -q .; then
            echo "a keystore is staged for a PUBLIC branch -- refusing." >&2
            exit 1
          fi
          # entry.json pins index-v2.json by sha256 AND size, so one LF
          # rewritten to CRLF on some future checkout invalidates the whole
          # repository and every client declines it in silence. `* -text`
          # disables end-of-line conversion outright, and it lives on the
          # branch rather than in a workflow because the checkout that could
          # corrupt these bytes is pages.yml's, not this one. The backticks are
          # literal text for that file, so single quotes are the point.
          # shellcheck disable=SC2016
          printf '# Every file on this branch is a SIGNED ARTEFACT and must survive a round\n# trip through git byte for byte. `-text` disables end-of-line conversion.\n* -text\n' > .gitattributes
          git init -q -b fdroid-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "F-Droid repository for app-v$VERSION"
          git push --force --quiet "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" fdroid-repo
          # Prove it landed, in the same spirit as push_one's fetch-and-diff.
          git fetch --quiet "https://github.com/$GITHUB_REPOSITORY" fdroid-repo
          git diff --quiet HEAD FETCH_HEAD || { echo "fdroid-repo did not land as written" >&2; exit 1; }
          echo "fdroid-repo carries the index for $VERSION."

  # Deploy the site, so the repository the job above just built is served.
  #
  # A DISPATCH rather than adding app-v* to pages.yml's own tags, and the race
  # is what decides it: a tag-triggered pages run starts on the same push and
  # would check out fdroid-repo some fifteen minutes of Rust builds BEFORE the
  # fdroid job pushes to it, deploying the previous repository and never
  # looking again. `needs: fdroid` is ordered by construction. It also
  # sidesteps the tag-trigger staleness documented at the top of pages.yml,
  # whose recorded workaround is precisely a workflow_dispatch on main -- and
  # it leaves that file's anchored-glob comment true, which is what keeps the
  # npm and app releases from reaching into each other's workflows.
  #
  # The job-level permissions block REPLACES the workflow one rather than
  # adding to it, and the workflow block grants no actions: write.
  pages:
    needs: [check, fdroid]
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.check.outputs.version, '-') }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the site with the new F-Droid repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
