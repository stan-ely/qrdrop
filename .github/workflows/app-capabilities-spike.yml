# THROWAWAY -- Phase 0 of the Tauri onboarding only. Manually triggered
# (workflow_dispatch), never on push: this exists to answer one question once
# per platform -- does the webview here actually have what src/web/ needs --
# not to run on every commit. Windows and Android are covered locally (see
# app/CAPABILITIES.md); this covers the two platforms this Windows machine
# cannot build for itself. Delete this file once Phase 1 replaces app/spike/
# with the real frontend, or repurpose it then if per-platform smoke checks
# still seem worth keeping.
name: app capabilities spike

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri's own Linux prerequisites -- webkit2gtk is the whole reason
      # this job exists rather than being assumed to behave like the other
      # two. libayatana-appindicator3 is a tray-icon dependency this app does
      # not use yet, kept only because Tauri's build script checks for it
      # unconditionally.
      - name: install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install
        working-directory: app

      - run: npx tauri build --debug --no-bundle
        working-directory: app

      # xvfb-run: WebKitGTK needs a real X11 display to create a webview at
      # all, and this runner has none. `-a` (not the invented
      # `--auto-servername` this first shipped with) picks a free display
      # number. The spike writes its own result file and never exits on its
      # own, so it is bounded by backgrounding it and killing it after 30s --
      # comfortably past the slowest probe (ICE gather's own 15s ceiling)
      # plus startup -- rather than by a `timeout` wrapper, which does not
      # play well with xvfb-run's own child-process handling.
      - name: run the spike under Xvfb
        working-directory: app
        run: |
          xvfb-run -a ./src-tauri/target/debug/qrdrop &
          pid=$!
          # 75s, not 30: on a run with no camera device, WebKitGTK's own
          # media-capture negotiation ("Video capture was requested but no
          # device was found") blocks well past this page's 5s JS-level
          # getUserMedia timeout before it ever rejects the promise, so 30s
          # cut the run off before log_capabilities was ever invoked. That
          # blocking behaviour is itself the Phase 0 finding worth recording
          # for this platform -- see app/CAPABILITIES.md.
          sleep 75
          kill "$pid" 2>/dev/null || true
          echo "--- capabilities.json ---"
          cat src-tauri/target/debug/capabilities.json

      - uses: actions/upload-artifact@v4
        with:
          name: capabilities-linux
          path: app/src-tauri/target/debug/capabilities.json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install
        working-directory: app

      - run: npx tauri build --debug --no-bundle
        working-directory: app

      # No Xvfb equivalent needed: macOS runners carry a real WindowServer
      # session, so a WKWebView-backed window can open same as it would on a
      # developer's machine. `timeout` is a GNU coreutils command that does
      # not exist on macOS's BSD userland -- background-and-kill instead,
      # same as the Linux job.
      - name: run the spike
        working-directory: app
        run: |
          ./src-tauri/target/debug/qrdrop &
          pid=$!
          sleep 30
          kill "$pid" 2>/dev/null || true
          echo "--- capabilities.json ---"
          cat src-tauri/target/debug/capabilities.json

      - uses: actions/upload-artifact@v4
        with:
          name: capabilities-macos
          path: app/src-tauri/target/debug/capabilities.json
