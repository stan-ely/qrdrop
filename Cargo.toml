# The Rust session: the crates the apps and the CLI run a transfer through.
# docs/notes/rust-session.md is the plan and its tracking document; read its
# Status section before changing anything here.
#
# The app (app/src-tauri) is a member, and that is the reproducible build's
# requirement rather than tidiness. Cargo hashes every package into its
# symbols' metadata, and a path dependency is hashed by its path relative to
# the workspace root when it sits under that root -- and by its absolute path
# when it does not. As its own workspace, the app reached crates/ from outside
# its root, so the APK would have carried the checkout's absolute path in that
# hash: phase 1 measured exactly this, 128 bytes of difference between two
# checkouts with no path visible in either binary. That is invisible to
# --remap-path-prefix, and it is the one difference app-reproducible.yml exists
# to refuse, because f-droid.org's checkout is never at our path.
#
# What the app's own workspace used to protect is kept another way:
# - Its target/ is still app/src-tauri/target, through app/src-tauri/.cargo/
#   config.toml, so every path in the workflows and scripts stays true. Cargo
#   reads that file only when it runs from app/src-tauri, which is where Tauri
#   runs it.
# - Its version is still the literal first `version =` in its Cargo.toml, so
#   app-release.yml's sed and cargo-release read the app's own number.
# - It is not a default member. A bare `cargo test` or `cargo clippy` here is
#   the session crates, and CI's `--workspace` runs say `--exclude qrdrop`:
#   the app needs a webview's system packages and a built app/dist, which only
#   the app workflows install.
#
# One Cargo.lock for both, at this root. Its app half was merged from the
# app's old lock, version for version, so becoming a member upgraded nothing.
[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]
exclude = ["vendor"]

# Patched crates, kept inside this tree because a patch outside the workspace
# root is hashed by its absolute path into every symbol, and the Android .so
# then differs between two checkouts (phase 1 measured exactly that). They are
# excluded above, so --workspace never lints or tests someone else's code.
# vendor/README.md says what each patch is and when it can go.
[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }

# Shared by every member. Not `version`: each crate is versioned on its own,
# since tryst is meant to be published apart from the rest (phase 10).
[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/stan-ely/qrdrop"
authors = ["Bevan Stanely"]

# Crypto at a usable speed in dev and test builds, which takes two overrides.
# Unoptimised, AES-GCM runs at about 1 MB/s, and qrdrop-protocol's two
# backpressure tests (a few MiB each, the least that crosses the 4 MiB pause
# mark) took 12 s of a suite that is otherwise instant. The cipher's rounds and
# SHA-256's compression are compiled in their own crates, which is the first
# override; but AES-GCM itself is generic, so it is instantiated -- and
# optimised or not -- in the crate that names it, which is the second. Either
# alone measured 5-6.5 s, both 0.2 s. qrdrop-protocol at opt-level 1 still
# steps fine in a debugger; the other workspace crates stay at 0.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.qrdrop-protocol]
opt-level = 1
