[package]
# Trystero 0.25-compatible rooms. Named apart from Trystero on purpose: the
# plain name on crates.io would read as upstream's own crate, and this is a
# second implementation of its wire, not a release of it.
name = "tryst"
version = "0.1.0"
description = "Rooms that interoperate with Trystero 0.25 peers: signalling, signal crypto, the action wire and the handshake"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["trystero", "webrtc", "p2p", "nostr", "signalling"]
categories = ["network-programming"]
# Publishable. 0.0.1 was an empty release that held the name; 0.1.0 is the
# first with code in it. A published version can be yanked but never
# replaced, so a fix is always a new version. The tests read vectors/, which
# is inside this directory for that reason: a crate is packaged from here
# alone. LICENSE is a copy of the repository's, since `license` only names it.

[package.metadata.docs.rs]
# The runtime is behind features, and its docs are most of what a reader
# wants.
all-features = true

# Each optional transport is a feature, so a build carries only the paths its
# platform uses (see "Feature flags" in docs/notes/rust-session.md), and
# `cargo hack check --each-feature --no-dev-deps` builds each one alone, so a
# feature that only compiles beside another is caught the day it is written.
# The runtime (`join`) needs `webrtc` and `relay` both. The sans-IO core -- topics, signal crypto, the
# action wire, the room frame, the handshake -- is never behind a feature, so
# the vectors always test all of it.
[features]
default = ["nostr", "torrent", "webrtc", "turn"]
# The sans-IO TURN client (RFC 8656 over UDP). Independent of `webrtc`: it
# neither names str0m nor needs it, so the runtime is what joins them.
turn = ["dep:hmac", "dep:md-5"]
nostr = ["relay", "dep:k256"]
torrent = ["relay"]
# The relay connection both signalling clients share: WebSocket over rustls
# on ring, which phase 1 measured byte-reproducible for aarch64 Android.
relay = ["dep:socket2", "dep:if-addrs", "dep:tokio", "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots", "dep:futures-util"]
# sha2/oid: the certificate builder names its signature algorithm by OID.
# With `turn`: a peer that can reach no one directly has nothing else to
# fall back on, and the client costs two small RustCrypto crates.
webrtc = ["dep:str0m", "dep:p256", "dep:x509-cert", "sha2/oid", "turn"]

[dependencies]
# The sans-IO core. The same RustCrypto generation as qrdrop-protocol, for
# the reason its Cargo.toml gives: str0m's DTLS stack is built on it.
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
# preserve_order: a JS peer writes object keys in insertion order, and an
# action payload is compared byte for byte; serde_json sorts them without it.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha1 = "0.10.6"
sha2 = "0.10.9"

# turn: long-term credentials are HMAC-SHA1 keyed by an MD5 (RFC 8489).
hmac = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }

# webrtc: str0m on its pure-Rust crypto backend, which the root Cargo.toml
# patches to drop aws-lc-sys (vendor/README.md), and what it takes to make
# the DTLS certificate that the patch leaves to the caller.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"], optional = true }
x509-cert = { version = "0.2.5", features = ["builder"], optional = true }

# The room socket's buffers, which tokio's UdpSocket cannot set. Already in
# the tree under tokio, and pure Rust over libc and windows-sys.
socket2 = { version = "0.6.5", optional = true }
# The room binds a socket on each interface, for a host candidate per network
# (join.rs, `bind_extra`). Already in the tree under qrdrop-session.
if-addrs = { version = "0.15.0", optional = true }
# nostr and torrent: the relay clients and the runtime that joins a room.
tokio = { version = "1.53.3", features = ["rt", "net", "time", "sync", "macros"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
# BIP-340 Schnorr for Nostr events, at the 0.13 generation p256 is on.
k256 = { version = "0.13.4", default-features = false, features = ["schnorr", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

# The runtime's tests and examples need a relay client and a peer connection.
[[test]]
name = "join"
required-features = ["webrtc", "nostr", "torrent"]

[[example]]
name = "turn-probe"
required-features = ["turn"]

[[example]]
name = "peer"
required-features = ["webrtc", "nostr", "torrent"]

[[example]]
name = "standin-relay"
required-features = ["webrtc", "nostr", "torrent"]
