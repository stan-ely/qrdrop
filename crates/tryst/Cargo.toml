[package]
# Trystero 0.25-compatible rooms. Named apart from Trystero on purpose: the
# plain name on crates.io would read as upstream's own crate, and this is a
# second implementation of its wire, not a release of it.
name = "tryst"
version = "0.0.1"
description = "Rooms that interoperate with Trystero 0.25 peers: signalling, signal crypto, the action wire and the handshake"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["trystero", "webrtc", "p2p", "nostr", "signalling"]
categories = ["network-programming"]
# Publishable. 0.0.1 is the early, empty release that holds
# the name until phase 10 settles the API (docs/notes/rust-session.md). Bump
# the version for anything published after it; a published version can be
# yanked but never replaced.

# Each optional transport is a feature, so a build carries only the paths its
# platform uses (see "Feature flags" in docs/notes/rust-session.md). Empty
# until the code behind them exists; declared now so CI's feature matrix runs
# from the first commit, and a feature that only compiles beside another is
# caught the day it is written. The sans-IO core -- topics, signal crypto, the
# action wire, the room frame, the handshake -- is never behind a feature, so
# the vectors always test all of it.
[features]
default = ["nostr", "torrent", "webrtc"]
nostr = []
torrent = []
# sha2/oid: the certificate builder names its signature algorithm by OID.
webrtc = ["dep:str0m", "dep:p256", "dep:x509-cert", "sha2/oid"]

[dependencies]
# The sans-IO core. The same RustCrypto generation as qrdrop-protocol, for
# the reason its Cargo.toml gives: str0m's DTLS stack is built on it.
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
# preserve_order: a JS peer writes object keys in insertion order, and an
# action payload is compared byte for byte; serde_json sorts them without it.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha1 = "0.10.6"
sha2 = "0.10.9"

# webrtc: str0m on its pure-Rust crypto backend, which the root Cargo.toml
# patches to drop aws-lc-sys (vendor/README.md), and what it takes to make
# the DTLS certificate that the patch leaves to the caller.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"], optional = true }
x509-cert = { version = "0.2.5", features = ["builder"], optional = true }
