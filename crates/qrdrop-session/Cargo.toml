[package]
name = "qrdrop-session"
version = "0.0.0"
description = "A qrdrop session: pairing over tryst, the send and receive loops, file IO and the local-network path"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Nothing on by default: each caller names what its platform uses. The app's
# Windows and macOS builds leave out lan-listen at the Cargo level, which is a
# stronger guarantee against a firewall prompt than the runtime MODE constant
# in app/src-tauri/src/lan.rs. A build without a path says so on the wire --
# `listen: "none"` -- and never guesses (docs/notes/rust-session.md).
[features]
# Dialling a peer's local-network listener: a WebSocket client, no TLS.
lan-dial = ["dep:tokio-tungstenite", "tokio-tungstenite/connect"]
# Listening for one: a WebSocket server and the interface list for the offer.
lan-listen = ["dep:tokio-tungstenite", "tokio-tungstenite/handshake", "dep:if-addrs"]
quic = []
# std files as the Source and Sink; Android brings its own sink.
fs = []

[dependencies]
qrdrop-protocol = { path = "../qrdrop-protocol" }
# Every platform pairs over both strategies, so these are not session
# features: a session without one of them races one network instead of two.
tryst = { path = "../tryst", default-features = false, features = ["webrtc", "nostr", "torrent"] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros", "net"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, optional = true }
if-addrs = { version = "0.15.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
serde_json = "1.0.145"

[[test]]
name = "session"
required-features = ["fs"]
