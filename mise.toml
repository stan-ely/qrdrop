# Hugo is gone: the site is now built by scripts/build-site.mjs, so Node is the
# whole toolchain. That consolidation was not the goal of the rewrite but it
# came free with it -- an npm package needs Node regardless, and Hugo was
# contributing one templated title.
#
# Node 24 rather than 22 (the package's declared floor): the CLI relies on a
# native WebSocket and a native File, both of which landed in 22, and 24 is
# what this is developed against.
[tools]
node = "24"

[tasks.test]
description = "Run unit tests"
run = "node --test"

[tasks.typecheck]
description = "Type-check web and node entry points"
run = "tsc -p tsconfig.json --noEmit && tsc -p tsconfig.node.json --noEmit"

[tasks.build]
description = "Build the static site"
run = "node scripts/build-site.mjs"

# The deploy preview: build site/dist/ and serve it flat on :4173, the way a
# host would. No browser is opened and nothing is rebuilt on change -- this is
# for checking what ships, not for working on the UI.
[tasks.start]
description = "Build and serve site/dist/ on :4173 (deploy preview)"
run = "node scripts/build-site.mjs --serve"

# `web` is the name people reach for when they want to look at the UI the way a
# user gets it: it builds, then runs the real `qrdrop web` subcommand, which
# serves the built bundle on 127.0.0.1 and opens a browser. Args pass through --
#   mise run web -- --port 5000 --no-open
# "start" stays separate because it says nothing about which of the three faces
# it starts, and because it deliberately does not spawn a browser.
[tasks.web]
description = "Build, then run `qrdrop web` (serves the bundle, opens a browser)"
alias = "ui"
run = "node scripts/build-site.mjs && node src/cli.js web"

# Arguments after `--` are appended, so this drives the real CLI rather than a
# copy of its argument list that would drift:
#   mise run cli -- send report.pdf
#   mise run cli -- receive --out ~/Downloads
[tasks.cli]
description = "Run the qrdrop CLI (mise run cli -- send report.pdf)"
run = "node src/cli.js"

[tasks."test:e2e"]
description = "Run browser-to-browser e2e transfer test"
depends = ["build"]
run = "node e2e/transfer.e2e.mjs"

[tasks."test:e2e:interop"]
description = "Run web/node interop e2e test"
depends = ["build"]
run = "node e2e/interop.e2e.mjs"
