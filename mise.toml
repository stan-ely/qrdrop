# Hugo is gone: the site is now built by scripts/build-site.mjs, so Node is the
# whole toolchain. That consolidation was not the goal of the rewrite but it
# came free with it -- an npm package needs Node regardless, and Hugo was
# contributing one templated title.
#
# Node 24 rather than 22 (the package's declared floor): the CLI relies on a
# native WebSocket and a native File, both of which landed in 22, and 24 is
# what this is developed against.
#
# Rust, the JDK, and cargo-release are pinned here too, even though only app/
# needs them, for the same reason node is pinned above: a toolchain resolved
# by whatever happens to be on PATH is not a toolchain anyone can reproduce.
# All three track latest stable except the JDK: Temurin 25 is the newest LTS,
# but the Android Gradle Plugin's own compatibility table has not certified
# anything past 21 at time of writing, and a Phase 4 Android build failing on
# an uncertified JDK is a worse trade than one version behind "latest". 21
# stays until AGP's table says otherwise.
[tools]
node = "24"
rust = "1.98.1"
java = "temurin-21"
cargo-release = "1.1.5"
# Android SDK *command-line tools* only -- about 150 MB, not the toolchain.
# The vfox plugin behind this unpacks cmdline-tools and exports ANDROID_HOME,
# ANDROID_SDK_ROOT and the bin dirs; the multi-gigabyte parts (NDK, platforms,
# build-tools) are pulled separately by `android sdk install` into the same
# directory and are NOT managed by mise. That split is what makes pinning it
# here cheap enough to be worth the reproducibility -- an earlier pass left it
# out on the theory that mise's auto-install would drag gigabytes into a bare
# `mise run test`, which was simply wrong about what this plugin does.
android-sdk = "23.0"

# The SDK packages the pin above does NOT carry, named once. NDK_HOME below
# and the app:android:sdk task both read these, so the version a build links
# against and the version that gets installed cannot drift apart -- the same
# reasoning that keeps design tokens in one file and derives the CSP from
# SIGNALING_URLS. `android_sdk` repeats the tool version above because the
# install path has to be reconstructed by hand; see NDK_HOME.
[vars]
android_sdk = "23.0"
android_ndk = "29.0.14206865"
android_build_tools = "37.0.0"
android_platform = "android-36"

# npm puts node_modules/.bin on PATH for the scripts it runs; mise does not, so
# a task that mirrors `npm run typecheck` verbatim ("tsc -p ...") cannot find
# tsc without this. Prepending the local bin dir is what makes `mise run
# typecheck` / `build` behave the way the npm script they copy does, rather
# than every task line growing an `npx` the package.json equivalent lacks.
[env]
_.path = ["node_modules/.bin"]

# ANDROID_HOME comes from the android-sdk tool above; NDK_HOME does not, and
# `tauri android init` refuses to run without it. It has to name one specific
# NDK rather than the ndk/ directory, so it carries a version and is the line
# to change when that moves. 29.0.14206865 is the newest STABLE NDK: every
# 30.x in the repository is still a release candidate, which the package path
# does not say -- only the version field's `-rc.N` suffix does. NDK 28+ also
# gets the 16 KB page alignment Google Play now requires of new submissions,
# so going back further is not free either.
#
# Built from xdg_data_home rather than the obvious `{{env.ANDROID_HOME}}`,
# because a tool's own exports are not in scope while this table is evaluated
# -- mise fails outright with "Field ANDROID_HOME is not defined". The
# documented `tools["android-sdk"].path` is not in scope here either, for the
# same ordering reason. xdg_data_home is, and it lands on AppData\Local on
# Windows and ~/.local/share elsewhere, which is where mise puts installs on
# both. The cost is that the "23.0" below repeats the tool version above:
# the two lines move together.
NDK_HOME = "{{ xdg_data_home }}/mise/installs/android-sdk/{{vars.android_sdk}}/ndk/{{vars.android_ndk}}"

[tasks.test]
description = "Run unit tests"
run = "node --test"

[tasks.typecheck]
description = "Type-check web and node entry points"
run = "tsc -p tsconfig.json --noEmit && tsc -p tsconfig.node.json --noEmit"

[tasks.build]
description = "Build the static site"
run = "node scripts/build-site.mjs"

# The deploy preview: build site/dist/ and serve it flat on :4173, the way a
# host would. No browser is opened and nothing is rebuilt on change -- this is
# for checking what ships, not for working on the UI.
[tasks.start]
description = "Build and serve site/dist/ on :4173 (deploy preview)"
run = "node scripts/build-site.mjs --serve"

# `web` is the name people reach for when they want to look at the UI the way a
# user gets it: it builds, then runs the real `qrdrop web` subcommand, which
# serves the built bundle on 127.0.0.1 and opens a browser. Args pass through --
#   mise run web -- --port 5000 --no-open
# "start" stays separate because it says nothing about which of the three faces
# it starts, and because it deliberately does not spawn a browser.
[tasks.web]
description = "Build, then run `qrdrop web` (serves the bundle, opens a browser)"
alias = "ui"
run = "node scripts/build-site.mjs && node src/cli.js web"

# Arguments after `--` are appended, so this drives the real CLI rather than a
# copy of its argument list that would drift:
#   mise run cli -- send report.pdf
#   mise run cli -- receive --out ~/Downloads
[tasks.cli]
description = "Run the qrdrop CLI (mise run cli -- send report.pdf)"
run = "node src/cli.js"

[tasks."test:e2e"]
description = "Run browser-to-browser e2e transfer test"
depends = ["build"]
run = "node e2e/transfer.e2e.mjs"

[tasks."test:e2e:interop"]
description = "Run web/node interop e2e test"
depends = ["build"]
run = "node e2e/interop.e2e.mjs"

[tasks.phone]
description = "Open UI in browser with phone-sized viewport (390x844)"
depends = ["build"]
run = "node scripts/preview-phone.mjs"

# --- committed images and the layout check ---
#
# All hand-run and all out of `npm run build` (it runs in CI and in
# prepublishOnly, where downloading a browser is not acceptable). Their output is
# committed; run the one whose source changed. Each script's header explains why
# it is a separate script rather than a build step. Grouped under img:/check: so
# they do not bury the everyday tasks above in `mise tasks`.

[tasks."img:og"]
description = "Render site/og.png (run when the wordmark, palette, or card copy changes)"
run = "node scripts/make-og.mjs"

# Renders the app mark and the site favicon. The fan-out to every platform
# size is deliberately NOT chained on here: `npx tauri icon
# app/src-tauri/icons/source.png` writes into app/src-tauri/gen/, which is
# committed source, and that diff wants reading rather than running.
[tasks."img:icon"]
description = "Render the app mark (then run `npx tauri icon` by hand)"
run = "node scripts/make-icon.mjs"

[tasks."img:diagrams"]
description = "Render docs/diagrams/*.png from the .mmd sources"
run = "node scripts/make-diagrams.mjs"

[tasks."img:screenshots"]
description = "Render the README's three UI screenshots"
depends = ["build"]
run = "node scripts/make-screenshots.mjs"

# `depends = ["build"]` rebuilds site/dist -- the check reads a built tree. A
# positional arg picks a different tree to walk (mise appends it to the command,
# the same way `mise run cli -- ...` forwards args); the stable rebuild is then a
# harmless no-op you would have run anyway:
#   mise run check:layout site/dist-edge
# check-layout.mjs falls back to site/dist when no arg is given.
[tasks."check:layout"]
description = "Walk every screen at four viewports; fail on a scroll or an off-screen button"
depends = ["build"]
run = "node scripts/check-layout.mjs"

# --- app/ (Tauri desktop/mobile shell) ---
#
# First run needs `npm install` inside app/ once -- not a dependency of every
# task below, since re-running npm install on every `mise run app:dev` would
# slow the inner dev loop for a check that is almost always a no-op.

[tasks."app:build-site"]
description = "Build the website for the app channel into app/dist"
run = "node scripts/build-site.mjs --channel app --out app/dist"

[tasks."app:config"]
description = "Regenerate app/src-tauri/tauri.conf.json's CSP from SIGNALING_URLS"
run = "node scripts/generate-tauri-config.mjs"

# The gate for Phase 1: this should open a window showing today's UI,
# unchanged, against a live frontend -- `tauri dev`'s own file-watching only
# covers app/src-tauri, so app/dist is built once up front rather than
# reactively; re-run this task after editing anything under src/ or site/.
[tasks."app:dev"]
description = "Run the desktop app shell (mise run app:dev)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri dev"

[tasks."app:build"]
description = "Build an installer for this platform (mise run app:build -- --debug)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri build"

# --- mobile (Phase 4) ---
#
# ANDROID_HOME and NDK_HOME are handled above. The SDK *packages* are not:
# mise installs the command-line tools, and those tools then install the NDK,
# a platform and build-tools into the same directory. One consequence worth
# knowing before you `mise uninstall android-sdk`: those packages live inside
# mise's install dir, so removing the tool takes several gigabytes of NDK with
# it. app/CAPABILITIES.md carries the exact `android sdk install` line.
#
# JAVA_HOME is NOT set here -- mise's own `java` tool exports it, and a second
# copy would be the drift this file avoids everywhere else.

# The packages the android-sdk pin does not carry. Idempotent -- re-running it
# is how you move to a newer NDK after editing [vars]. Note `sdkmanager` is
# deprecated and defers to this `android` CLI, whose package separator is `/`
# and not the `;` that every older instruction on the internet uses.
[tasks."app:android:sdk"]
description = "Install the Android SDK packages (NDK, platform, build-tools)"
run = "android sdk install platform-tools ndk/{{vars.android_ndk}} build-tools/{{vars.android_build_tools}} platforms/{{vars.android_platform}}"

[tasks."app:android:targets"]
description = "Add the four Android Rust targets"
run = "rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"

# `tauri android init` adds these targets itself, but doing it explicitly
# first means a missing target fails here, saying so, rather than surfacing
# later as a linker error against a std that was never installed.
[tasks."app:android:init"]
description = "Scaffold app/src-tauri/gen/android (one-time; commit the result)"
depends = ["app:config", "app:android:targets"]
dir = "app"
run = "npx tauri android init"

[tasks."app:android:dev"]
description = "Run the app on an attached Android device or emulator"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri android dev"

[tasks."app:android:build"]
description = "Build an Android APK (mise run app:android:build -- --debug)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri android build --apk"

# macOS only -- these need Xcode and CocoaPods, so on any other host they
# exist to document the command, not to be run. CI (.github/workflows/app.yml)
# is the only place iOS is compiled at all; there is no Mac on this project.
[tasks."app:ios:targets"]
description = "Add the iOS Rust targets (macOS only)"
run = "rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"

[tasks."app:ios:init"]
description = "Scaffold app/src-tauri/gen/apple (macOS only; one-time, commit the result)"
depends = ["app:config", "app:ios:targets"]
dir = "app"
run = "npx tauri ios init"

[tasks."app:ios:build"]
description = "Build the iOS app (macOS only; needs a signing identity)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri ios build"
