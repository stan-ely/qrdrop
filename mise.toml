# Hugo is gone: the site is now built by scripts/build-site.mjs, so Node is the
# whole toolchain. That consolidation was not the goal of the rewrite but it
# came free with it -- an npm package needs Node regardless, and Hugo was
# contributing one templated title.
#
# Node 24 rather than 22 (the package's declared floor): the CLI relies on a
# native WebSocket and a native File, both of which landed in 22, and 24 is
# what this is developed against.
#
# Rust, the JDK, and cargo-release are pinned here too, even though only app/
# needs them, for the same reason node is pinned above: a toolchain resolved
# by whatever happens to be on PATH is not a toolchain anyone can reproduce.
# All three track latest stable except the JDK: Temurin 25 is the newest LTS,
# but the Android Gradle Plugin's own compatibility table has not certified
# anything past 21 at time of writing, and a Phase 4 Android build failing on
# an uncertified JDK is a worse trade than one version behind "latest". 21
# stays until AGP's table says otherwise.
[tools]
node = "24"
rust = "1.98.1"
java = "temurin-21"
cargo-release = "1.1.5"

[tasks.test]
description = "Run unit tests"
run = "node --test"

[tasks.typecheck]
description = "Type-check web and node entry points"
run = "tsc -p tsconfig.json --noEmit && tsc -p tsconfig.node.json --noEmit"

[tasks.build]
description = "Build the static site"
run = "node scripts/build-site.mjs"

# The deploy preview: build site/dist/ and serve it flat on :4173, the way a
# host would. No browser is opened and nothing is rebuilt on change -- this is
# for checking what ships, not for working on the UI.
[tasks.start]
description = "Build and serve site/dist/ on :4173 (deploy preview)"
run = "node scripts/build-site.mjs --serve"

# `web` is the name people reach for when they want to look at the UI the way a
# user gets it: it builds, then runs the real `qrdrop web` subcommand, which
# serves the built bundle on 127.0.0.1 and opens a browser. Args pass through --
#   mise run web -- --port 5000 --no-open
# "start" stays separate because it says nothing about which of the three faces
# it starts, and because it deliberately does not spawn a browser.
[tasks.web]
description = "Build, then run `qrdrop web` (serves the bundle, opens a browser)"
alias = "ui"
run = "node scripts/build-site.mjs && node src/cli.js web"

# Arguments after `--` are appended, so this drives the real CLI rather than a
# copy of its argument list that would drift:
#   mise run cli -- send report.pdf
#   mise run cli -- receive --out ~/Downloads
[tasks.cli]
description = "Run the qrdrop CLI (mise run cli -- send report.pdf)"
run = "node src/cli.js"

[tasks."test:e2e"]
description = "Run browser-to-browser e2e transfer test"
depends = ["build"]
run = "node e2e/transfer.e2e.mjs"

[tasks."test:e2e:interop"]
description = "Run web/node interop e2e test"
depends = ["build"]
run = "node e2e/interop.e2e.mjs"

[tasks.phone]
description = "Open UI in browser with phone-sized viewport (390x844)"
depends = ["build"]
run = "node scripts/preview-phone.mjs"

# --- app/ (Tauri desktop/mobile shell) ---
#
# First run needs `npm install` inside app/ once -- not a dependency of every
# task below, since re-running npm install on every `mise run app:dev` would
# slow the inner dev loop for a check that is almost always a no-op.

[tasks."app:build-site"]
description = "Build the website for the app channel into app/dist"
run = "node scripts/build-site.mjs --channel app --out app/dist"

[tasks."app:config"]
description = "Regenerate app/src-tauri/tauri.conf.json's CSP from SIGNALING_URLS"
run = "node scripts/generate-tauri-config.mjs"

# The gate for Phase 1: this should open a window showing today's UI,
# unchanged, against a live frontend -- `tauri dev`'s own file-watching only
# covers app/src-tauri, so app/dist is built once up front rather than
# reactively; re-run this task after editing anything under src/ or site/.
[tasks."app:dev"]
description = "Run the desktop app shell (mise run app:dev)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri dev"

[tasks."app:build"]
description = "Build an installer for this platform (mise run app:build -- --debug)"
depends = ["app:build-site", "app:config"]
dir = "app"
run = "npx tauri build"
