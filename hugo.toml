baseURL = '/'
locale = 'en-us'   # `languageCode` is deprecated as of Hugo v0.158
title = 'qrbeam'

# Single-page app: none of Hugo's list machinery applies.
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']

[outputs]
home = ['HTML']

[minify]
disableJS = true   # the JS is hand-written ES modules served as-is from static/

[params]
description = 'Files, straight between two devices. Nothing in the middle holds them.'
