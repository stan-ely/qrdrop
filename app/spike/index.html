<!DOCTYPE html>
<!--
  Phase 0 capability spike -- throwaway. See app/CAPABILITIES.md.

  This page is NOT the qrdrop UI. It exists only to answer one question per
  platform: does this webview actually have what src/web/ needs, and can this
  device reach the real network dependencies (ICE, a signalling relay)? Once
  app/CAPABILITIES.md is written and reviewed, tauri.conf.json's frontendDist
  moves to the real built site (Phase 1) and this directory can go.

  The constants below (ICE_SERVERS, one entry from RELAYS) are copied from
  src/transport/room.js rather than imported, because this page has no
  bundler and no import map for the rest of src/ -- copying a few literals
  for a throwaway probe is simpler than wiring a build step that gets deleted
  next phase. If these ever drift from room.js, it only matters for the
  lifetime of this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>qrdrop capability spike</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; background: #0b0b12; color: #e6e6f0; }
  h1 { font-size: 1rem; margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 0.35rem 0.5rem; border-bottom: 1px solid #2a2a3a; vertical-align: top; }
  td:first-child { white-space: nowrap; color: #9a9ab0; }
  .pass { color: #6ee7a0; }
  .fail { color: #f28b8b; }
  .pending { color: #9a9ab0; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; }
</style>
</head>
<body>
<h1>qrdrop -- Phase 0 capability spike</h1>
<table id="results"></table>
<script type="module">
  const ICE_SERVERS = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:global.stun.twilio.com:3478' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:stun.relay.metered.ca:80' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  ]
  // One relay, not all seven -- the point is "can this device open a wss://
  // socket at all", which any single reachable relay answers.
  const ONE_RELAY = 'wss://nos.lol'

  const table = document.getElementById('results')
  const rows = new Map()

  function setRow(name, status, detail) {
    let row = rows.get(name)
    if (!row) {
      row = document.createElement('tr')
      const label = document.createElement('td')
      label.textContent = name
      const value = document.createElement('td')
      row.append(label, value)
      table.appendChild(row)
      rows.set(name, row)
    }
    const cell = row.children[1]
    cell.className = status
    cell.innerHTML = ''
    const pre = document.createElement('pre')
    pre.textContent = detail
    cell.appendChild(pre)
  }

  const results = {}

  function record(name, ok, detail) {
    results[name] = { ok, detail }
    setRow(name, ok ? 'pass' : 'fail', `${ok ? 'PASS' : 'FAIL'} -- ${detail}`)
  }

  function pending(name) {
    setRow(name, 'pending', 'checking…')
  }

  async function withTimeout(promise, ms, label) {
    let timer
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error(`${label}: timed out after ${ms}ms`)), ms)
    })
    try {
      return await Promise.race([promise, timeout])
    } finally {
      clearTimeout(timer)
    }
  }

  // 1. Secure context -- gates WebCrypto and the camera on every browser this
  // ships to. If this is false, everything below it is moot.
  record('isSecureContext', window.isSecureContext === true, String(window.isSecureContext))

  // 2. WebCrypto. The whole confidentiality path (src/core/session.js,
  // src/core/frame.js) is ECDH + HKDF + AES-GCM via crypto.subtle; no
  // fallback exists or should.
  record('crypto.subtle', typeof crypto !== 'undefined' && !!crypto.subtle, typeof crypto?.subtle)

  // 3. showSaveFilePicker -- Chromium-only today (see src/web/sink.js).
  // Its absence is expected on non-Chromium webviews and is exactly what
  // Phase 2's platform seam exists to route around with a native sink.
  record('showSaveFilePicker', typeof window.showSaveFilePicker === 'function', String(typeof window.showSaveFilePicker))

  // 4. BarcodeDetector -- native QR decode. Its absence falls back to jsQR
  // (src/web/qr.js), which still works, just slower; recorded so Phase 4 can
  // judge whether Beam's ~10Hz camera loop is realistic on a given webview.
  record('BarcodeDetector', 'BarcodeDetector' in globalThis, String('BarcodeDetector' in globalThis))

  // 5. getUserMedia presence. Not a permission grant -- CI runners have no
  // camera and no human to click an OS permission prompt, so this only
  // checks the API exists, plus whether calling it resolves, rejects with a
  // device error, or rejects with a permission error, all of which are
  // distinguishable and worth recording separately.
  pending('getUserMedia')
  ;(async () => {
    const has = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    if (!has) return record('getUserMedia', false, 'navigator.mediaDevices.getUserMedia is not a function')
    try {
      const stream = await withTimeout(navigator.mediaDevices.getUserMedia({ video: true }), 5000, 'getUserMedia')
      stream.getTracks().forEach(t => t.stop())
      record('getUserMedia', true, 'API present, permission granted, stream opened and closed')
    } catch (error) {
      // Present-but-denied/no-device is still useful signal, not a spike
      // failure -- it says the API exists and the platform's permission
      // plumbing is reachable, which is what Phase 3 needs to know.
      record('getUserMedia', true, `API present, but call failed: ${error.name}: ${error.message}`)
    }
  })()

  // 6. RTCPeerConnection + a REAL ICE gather against room.js's ICE_SERVERS.
  // Presence of the constructor is not the question -- WebKitGTK on Linux is
  // the known risk here (see CLAUDE.md's Phase 0 note), and it can expose
  // RTCPeerConnection while failing to gather any usable candidate.
  pending('RTCPeerConnection + ICE gather')
  ;(async () => {
    if (typeof RTCPeerConnection !== 'function') {
      return record('RTCPeerConnection + ICE gather', false, 'RTCPeerConnection is not defined')
    }
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS })
    /** @type {string[]} */
    const types = []
    let candidateEvents = 0
    pc.onicecandidate = e => {
      candidateEvents++
      if (e.candidate?.type) types.push(e.candidate.type)
    }
    try {
      pc.createDataChannel('probe')
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      // Waiting for iceGatheringState === 'complete' is NOT what real pairing
      // does -- Trystero/WebRTC negotiate over trickle ICE, so a usable
      // candidate is a pass the moment it arrives. 'complete' was tried
      // first and found unreliable in exactly the way this comment now
      // warns about: on one target 15s produced host + three srflx
      // candidates (a fully workable ICE setup) while gatheringState sat at
      // 'gathering' the entire time, apparently waiting on the TURN entries
      // in ICE_SERVERS. Reporting that as a failure would be the probe
      // asserting a stricter bar than the app itself ever needs to clear.
      const gotUsableCandidate = new Promise(resolve => {
        pc.onicecandidate = e => {
          candidateEvents++
          if (e.candidate?.type) {
            types.push(e.candidate.type)
            resolve(undefined)
          }
        }
      })
      await withTimeout(gotUsableCandidate, 15000, 'ICE gather')
      const distinct = [...new Set(types)]
      record('RTCPeerConnection + ICE gather', distinct.length > 0, `candidate types seen so far: ${distinct.join(', ') || 'none'} (events: ${candidateEvents}, gatheringState: ${pc.iceGatheringState})`)
    } catch (error) {
      record('RTCPeerConnection + ICE gather', false, `${error.name}: ${error.message} -- candidate events so far: ${candidateEvents}, types: [${types.join(', ')}], gatheringState: ${pc.iceGatheringState}`)
    } finally {
      pc.close()
    }
  })()

  // 7. A live wss:// connect to one signalling relay -- proves outbound
  // WebSocket-over-TLS works from this webview/OS combination, independent
  // of WebRTC. Trystero (src/transport/room.js) depends on exactly this.
  pending('wss connect')
  ;(async () => {
    try {
      await withTimeout(new Promise((resolve, reject) => {
        const ws = new WebSocket(ONE_RELAY)
        ws.onopen = () => { ws.close(); resolve(undefined) }
        ws.onerror = () => reject(new Error('WebSocket error event'))
      }), 8000, 'wss connect')
      record('wss connect', true, `connected to ${ONE_RELAY}`)
    } catch (error) {
      record('wss connect', false, `${ONE_RELAY}: ${error.message}`)
    }
  })()

  // Give every async check a chance to settle, then hand the whole result
  // set to Rust so it lands in capabilities.json / stdout for CI to read --
  // a devtools console is not available on a CI runner.
  setTimeout(async () => {
    const payload = {
      platform: navigator.platform,
      userAgent: navigator.userAgent,
      results,
    }
    try {
      const { invoke } = window.__TAURI__.core
      await invoke('log_capabilities', { payload })
    } catch (error) {
      // No Tauri bridge (e.g. this page opened in a plain browser tab while
      // authoring it) -- fall back to a spot a human can still find.
      console.log('QRDROP_CAPABILITIES', JSON.stringify(payload))
    }
  }, 16000)
</script>
</body>
</html>
