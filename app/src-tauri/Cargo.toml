[package]
# This crate is the app going forward, not itself throwaway -- see
# app/CAPABILITIES.md for what IS throwaway about Phase 0 (the capability
# probe command below and the page it drives). Cargo.toml's `version` is the
# app's single source of truth per CLAUDE.md: it is deliberately independent
# of the root package.json version, and tauri.conf.json omits its own
# `version` field so Tauri reads this one instead of keeping two copies of
# one fact in step by hand.
name = "qrdrop"
version = "0.0.0"
description = "Send a file straight from one device to another -- desktop and mobile shell"
authors = ["Bevan Stanely"]
edition = "2021"
publish = false

[lib]
# Required by the mobile targets: Tauri's Android/iOS runners load the app as
# a library via JNI / linked into the Xcode project, rather than exec'ing a
# binary the way `tauri dev` does on desktop. `staticlib` is for iOS, `cdylib`
# for Android; plain `lib` keeps `cargo test` working against this crate on
# any host.
name = "qrdrop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "qrdrop"
path = "src/main.rs"
