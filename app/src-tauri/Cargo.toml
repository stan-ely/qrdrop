[package]
# This crate is the app going forward, not itself throwaway -- see
# app/CAPABILITIES.md for what IS throwaway about Phase 0 (the capability
# probe command below and the page it drives). Cargo.toml's `version` is the
# app's single source of truth per CLAUDE.md: it is deliberately independent
# of the root package.json version, and tauri.conf.json omits its own
# `version` field so Tauri reads this one instead of keeping two copies of
# one fact in step by hand.
name = "qrdrop"
version = "0.1.0"
description = "Send a file straight from one device to another -- desktop and mobile shell"
authors = ["Bevan Stanely"]
edition = "2021"
publish = false

[lib]
# Required by the mobile targets: Tauri's Android/iOS runners load the app as
# a library via JNI / linked into the Xcode project, rather than exec'ing a
# binary the way `tauri dev` does on desktop. `staticlib` is for iOS, `cdylib`
# for Android; plain `lib` keeps `cargo test` working against this crate on
# any host.
name = "qrdrop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
# The native sink: plugin-dialog's save() picks the destination, and this
# crate's own sink_* commands (src/sink.rs) move the bytes -- NOT plugin-fs,
# whose write() is bandwidth-bound at ~2 MB/s on WebView2 (app/CAPABILITIES.md
# has the measurements). plugin-fs stays registered only for the throwaway
# bench harness's sake.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Phase 3: the pairing QR now encodes a universal / app link
# (https://share.stan-ely.com/#qrdrop:<code>). This plugin registers the
# `qrdrop` custom scheme and the share.stan-ely.com app-link domain so the OS
# routes a scanned link to the app; app/src/deep-link.js turns the URL back
# into a code, preserving the fragment-only rule.
tauri-plugin-deep-link = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Windows and Linux deliver a deep link by launching a SECOND copy of the app
# with the URL in argv; single-instance forwards that to the running window
# instead (its `deep-link` feature wires the two plugins together). macOS and
# the mobile targets deliver the URL to the live process directly and need
# neither this plugin nor its cfg.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The camera-permission handler for WebView2 (src/lib.rs). WebView2 denies
# getUserMedia with no prompt unless the host app answers its
# PermissionRequested event (app/CAPABILITIES.md, Windows section), and that
# event is only reachable through the raw ICoreWebView2 pointer. Versions are
# pinned to what wry 0.55 / webview2-com 0.38 already resolve to in Cargo.lock
# -- a mismatch here surfaces as duplicate-COM-type trait errors, not a clear
# message.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[[bin]]
name = "qrdrop"
path = "src/main.rs"
